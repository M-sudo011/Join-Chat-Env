<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>همراه ثبت‌نام تپسی</title>
<style>
#join-chat{padding:18px 8px;color-scheme:light dark;font-family:Tahoma,Arial,sans-serif}
#join-chat *{box-sizing:border-box}
#join-chat .device{max-width:400px;margin:auto;overflow:hidden;border:1px solid light-dark(#ddd,#484848);border-radius:22px;background:light-dark(#fff,#191b1c);color:light-dark(#252726,#f0f0ed)}
#join-chat .app-header{display:flex;gap:12px;align-items:center;padding:19px 18px;border-bottom:1px solid light-dark(#ededeb,#363a3b);background:light-dark(#fff,#202324)}
#join-chat .mark{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:light-dark(#fff0e9,#4a3024);color:light-dark(#b2380b,#ffb294);font-size:18px;font-weight:500}
#join-chat .heading{font-size:14px;font-weight:500}
#join-chat .sub{font-size:11px;color:light-dark(#686d69,#b3b9b5);margin-top:3px}
#join-chat .history{display:flex;flex-direction:column;gap:15px;padding:23px 15px 24px;min-height:300px;justify-content:flex-end}
#join-chat .message{max-width:88%;padding:12px 14px;font-size:13px;line-height:1.95;overflow-wrap:anywhere;white-space:pre-wrap}
#join-chat .assistant{align-self:flex-end;background:light-dark(#f0f1ef,#303534);border-radius:15px 15px 15px 4px}
#join-chat .typing { display: flex; direction: ltr; align-items: center; gap: 5px; min-height: 43px; }
#join-chat .typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: light-dark(#637066, #b6c9ba);
  animation: typing-dot 900ms ease-in-out infinite;
}
#join-chat .typing span:nth-child(2) { animation-delay: 120ms; }
#join-chat .typing span:nth-child(3) { animation-delay: 240ms; }
#join-chat .composer[inert] > * { visibility: hidden; }
@keyframes typing-dot {
  0%, 65%, 100% { opacity: .45; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) {
  #join-chat .typing span { animation: none; }
}
#join-chat .driver{align-self:flex-start;background:light-dark(#dff3e3,#284a35);border-radius:15px 15px 4px 15px}
#join-chat .bubble-photo{display:block;width:100%;max-height:160px;object-fit:contain;border-radius:8px;margin-top:8px}
#join-chat .editor{display:block;text-align:left;margin-top:5px}
#join-chat button{font:inherit;color:inherit}
#join-chat .link{border:0;padding:6px 2px;background:transparent;font-size:11px;text-decoration:underline;text-underline-offset:3px;min-height:30px}
#join-chat .older{align-self:center;border:0;background:transparent;font-size:11px;color:light-dark(#606762,#c0c6c1);padding:8px}
#join-chat .composer{background:light-dark(#f5f6f4,#232827);padding:16px;border-top:1px solid light-dark(#e6e9e5,#3f4542)}
#join-chat .composer-title{font-size:12px;margin-bottom:12px;color:light-dark(#515a53,#c4cec6)}
#join-chat .options{display:grid;gap:9px}
#join-chat .option{width:100%;display:flex;justify-content:space-between;align-items:center;gap:9px;text-align:right;background:light-dark(#fff,#303632);border:1px solid light-dark(#dce1db,#4b564c);padding:12px 14px;border-radius:10px;font-size:13px;min-height:46px}
#join-chat .option-status{font-size:11px;color:light-dark(#637066,#b6c9ba);flex-shrink:0}
#join-chat .entry{display:flex;align-items:stretch;gap:8px}
#join-chat input,#join-chat select,#join-chat textarea{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px;border:1px solid light-dark(#d4dbd2,#5c685d);background:light-dark(#fff,#303632);color:inherit;border-radius:10px;min-height:46px}
#join-chat .entry select,#join-chat .entry input,#join-chat .entry textarea{flex:1}
#join-chat .send{border:0;border-radius:10px;background:light-dark(#242a25,#e0eae1);color:light-dark(#fff,#1b251d);padding:10px 15px;font-size:12px;min-height:46px;flex-shrink:0}
#join-chat .tools{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
#join-chat .tool{background:transparent;border:0;font-size:11px;min-height:38px;padding:5px 0;color:light-dark(#556258,#bdcbbf)}
#join-chat .error{font-size:12px;color:light-dark(#a02a1d,#ffb6a9);margin-top:8px}
#join-chat label{display:block;font-size:12px;margin-bottom:9px}
#join-chat .upload{display:flex;gap:8px}
#join-chat .upload button{flex:1}
#join-chat input[type=file]{display:none}
#join-chat button:disabled{opacity:.55}

:root { color-scheme: light dark; }
body { margin: 0; background: light-dark(#f2f4f1, #121513); }
#join-chat { padding: 0; }
#join-chat .device { display: flex; flex-direction: column; max-width: 460px; height: 100vh; height: 100dvh; }
#join-chat .app-header { flex: none; }
#join-chat .history { flex: 1; min-height: 0; overflow: auto; justify-content: flex-start; }
#join-chat .message { flex: none; font-size: 14px; }
#join-chat .composer { flex: none; max-height: 56dvh; overflow: auto; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
#join-chat .option, #join-chat .send { font-size: 14px; }
#join-chat .tool, #join-chat .link { min-height: 44px; font-size: 12px; }
#join-chat .tools { gap: 8px 14px; justify-content: flex-start; }
#join-chat .review-grid { display: grid; gap: 10px; margin-bottom: 12px; }
#join-chat .review-grid label { margin-bottom: 0; }
#join-chat .review-grid input { margin-top: 4px; }
#join-chat .review-action { width: 100%; }
#join-chat .sample { border: 1px dashed currentColor; border-radius: 8px; padding: 6px 10px; margin-top: 6px; font-size: 12px; }
#join-chat .upload { flex-wrap: wrap; }
#join-chat .upload .option { width: auto; }
#join-chat .city-trigger { flex: 1; min-width: 0; }
#join-chat .progress-trigger {
  flex: none;
  display: grid;
  gap: 3px;
  min-height: 44px;
  margin-inline-start: auto;
  padding: 6px 9px;
  border: 1px solid light-dark(#dce1db, #4b564c);
  border-radius: 8px;
  background: transparent;
  text-align: start;
  font-size: 12px;
}
#join-chat .progress-trigger .sub { margin: 0; }
#join-chat .progress-message { width: min(100%, 390px); max-width: 100%; white-space: normal; }
#join-chat .progress-widget { margin-top: 8px; }
#join-chat .progress-widget .progress-map { margin-block: 8px; }
#join-chat .progress-widget .progress-card { padding: 8px; gap: 4px; }
#join-chat .progress-controls { display: grid; gap: 8px; }
#join-chat .progress-controls label { margin: 0; }
#join-chat .progress-controls .tools { margin: 0; }
#join-chat .progress-field-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#join-chat .progress-field-actions .option { padding-inline: 9px; }
#join-chat .progress-field-actions .option-status:empty { display: none; }
#join-chat .sheet {
  width: min(460px, calc(100% - 24px));
  max-height: min(680px, calc(100dvh - 24px));
  padding: 0;
  border: 1px solid light-dark(#dce1db, #4b564c);
  border-radius: 16px;
  background: light-dark(#fff, #202324);
  color: inherit;
  overflow: hidden;
}
#join-chat .sheet[open] { display: flex; flex-direction: column; }
#join-chat .sheet::backdrop { background: rgb(0 0 0 / 45%); }
#join-chat .sheet-header { flex: none; padding: 12px 16px; border-bottom: 1px solid light-dark(#e6e9e5, #3f4542); }
#join-chat .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
#join-chat .sheet-heading h2 { margin: 0; font-size: 16px; }
#join-chat .sheet-heading form { margin: 0; }
#join-chat .city-picker .city-search { padding-inline: 12px; }
#join-chat .sheet-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 12px; }
#join-chat .progress-map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-block: 14px; }
#join-chat .progress-card {
  --card-ink: light-dark(#285e53, #a8ddd0);
  --card-fill: light-dark(#eaf6f0, #263e38);
  display: grid;
  gap: 7px;
  min-width: 0;
  padding: 12px;
  border: 2px solid transparent;
  border-radius: 16px;
  background: var(--card-fill);
  text-align: start;
}
#join-chat .progress-card[data-section="license"] { --card-ink: light-dark(#89501e, #f2c798); --card-fill: light-dark(#fff3e5, #423328); }
#join-chat .progress-card[data-section="car"] { --card-ink: light-dark(#315a89, #b7d4fb); --card-fill: light-dark(#eaf2ff, #28394d); }
#join-chat .progress-card[data-section="live"] { --card-ink: light-dark(#68458b, #e1c2fb); --card-fill: light-dark(#f4eefa, #3d3048); }
#join-chat .progress-card[data-selected] { border-color: var(--card-ink); }
#join-chat .progress-card-top { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
#join-chat .progress-icon { width: 26px; height: 26px; color: var(--card-ink); }
#join-chat .progress-card-title { font-size: 14px; font-weight: 600; }
#join-chat .progress-caption { font-size: 11px; color: var(--card-ink); }
#join-chat .progress-track { display: flex; gap: 4px; }
#join-chat .progress-track span { flex: 1; height: 4px; border-radius: 4px; background: currentColor; opacity: .14; }
#join-chat .progress-track [data-filled] { background: var(--card-ink); opacity: 1; }
#join-chat .progress-detail {
  padding: 14px;
  border-radius: 14px;
  background: light-dark(#f6f7f5, #29312e);
}
#join-chat .progress-detail h3 { margin: 0 0 10px; font-size: 14px; }
#join-chat .progress-steps { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
#join-chat .progress-step {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px dashed light-dark(#b1bdb4, #738278);
  border-radius: 10px;
  background: light-dark(#fff, #202623);
  text-align: start;
  font-size: 13px;
}
#join-chat .progress-step[data-filled] { border-style: solid; border-color: transparent; background: light-dark(#e1f2e7, #30483a); }
#join-chat .progress-check {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 19px;
  height: 19px;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-size: 12px;
  color: light-dark(#52675b, #b8c7bf);
}
#join-chat .progress-check[data-filled] { border-color: transparent; background: light-dark(#286146, #b1e5c1); color: light-dark(#fff, #203529); }
#join-chat .progress-status-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#join-chat .city-result {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 12px 4px;
  border: 0;
  border-bottom: 1px solid light-dark(#e6e9e5, #3f4542);
  background: transparent;
  text-align: start;
  font-size: 14px;
}
#join-chat .city-coverage, #join-chat .city-empty { color: light-dark(#515a53, #c4cec6); font-size: 12px; line-height: 1.8; }
#join-chat .city-coverage { display: block; margin-top: 4px; }
#join-chat .camera-sheet {
  height: min(700px, calc(100dvh - 24px));
  max-height: calc(100dvh - 24px);
  background: #101713;
  color: #f4f8f5;
  border-color: #36423a;
}
#join-chat .camera-header, #join-chat .camera-controls { flex: none; padding: 10px 16px; }
#join-chat .camera-header .sheet-heading { margin-bottom: 0; }
#join-chat .camera-sheet .tool { color: #f4f8f5; }
#join-chat .camera-view { position: relative; flex: 1; min-height: 0; overflow: hidden; container-type: size; background: #202b24; }
#join-chat .camera-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#join-chat .camera-view[data-shape="face"] video { transform: scaleX(-1); }
#join-chat .camera-frame {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  box-sizing: border-box;
  width: 84%;
  width: min(86cqw, 125cqh);
  aspect-ratio: 1.586;
  border: 1px solid rgb(255 255 255 / 75%);
  border-radius: 10px;
  box-shadow: 0 0 0 100vmax rgb(0 0 0 / 54%);
  pointer-events: none;
}
#join-chat .camera-view[data-shape="paper"] .camera-frame { width: 60%; width: min(77cqw, 58cqh); aspect-ratio: .707; }
#join-chat .camera-view[data-shape="face"] .camera-frame { width: 64%; width: min(67cqw, 55cqh); aspect-ratio: .74; border: 2px solid #fff; border-radius: 50%; }
#join-chat .camera-corner { position: absolute; width: 22px; height: 22px; border: solid #fff; border-width: 0; }
#join-chat .camera-corner:nth-child(1) { top: -1px; left: -1px; border-width: 3px 0 0 3px; border-top-left-radius: 10px; }
#join-chat .camera-corner:nth-child(2) { top: -1px; right: -1px; border-width: 3px 3px 0 0; border-top-right-radius: 10px; }
#join-chat .camera-corner:nth-child(3) { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; border-bottom-right-radius: 10px; }
#join-chat .camera-corner:nth-child(4) { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; border-bottom-left-radius: 10px; }
#join-chat .camera-view[data-shape="face"] .camera-corner { display: none; }
#join-chat .camera-status {
  position: absolute;
  inset: 50% 12px auto;
  transform: translateY(-50%);
  width: fit-content;
  max-width: calc(100% - 24px);
  margin: 0 auto;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgb(0 0 0 / 78%);
  font-size: 13px;
  text-align: center;
}
#join-chat .camera-controls { text-align: center; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
#join-chat .camera-hint { margin: 0 0 10px; color: #d8e5dc; font-size: 13px; line-height: 1.7; }
#join-chat .camera-shutter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 6px 16px;
  border: 0;
  border-radius: 30px;
  background: #f4f8f5;
  color: #101713;
  font-size: 14px;
}
#join-chat .camera-shutter span { width: 24px; height: 24px; border: 2px solid currentColor; border-radius: 50%; }
#join-chat .camera-fallback { min-height: 44px; margin-inline-start: 8px; text-decoration: underline; }
#join-chat .birthdate-trigger { margin-top: 4px; }
#join-chat .birth-picker { width: min(420px, calc(100% - 24px)); padding: 12px 16px 16px; overflow: auto; }
#join-chat .birth-picker .sheet-heading h2 { font-size: 18px; }
#join-chat .birth-wheels {
  --date-row: 48px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 24px 10px 20px;
}
#join-chat .birth-lane { position: relative; min-width: 0; }
#join-chat .birth-lane::after {
  content: '';
  position: absolute;
  inset: var(--date-row) 0;
  border-block: 1px solid light-dark(#d8ded9, #566359);
  pointer-events: none;
}
#join-chat .birth-wheel {
  height: calc(3 * var(--date-row));
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
#join-chat .birth-wheel::-webkit-scrollbar { display: none; }
#join-chat .birth-wheel::before, #join-chat .birth-wheel::after { content: ''; display: block; height: var(--date-row); }
#join-chat .birth-option {
  display: grid;
  place-items: center;
  height: var(--date-row);
  scroll-snap-align: center;
  color: light-dark(#67716a, #a9b5ad);
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}
#join-chat .birth-option[data-selected] { color: inherit; font-size: 16px; font-weight: 600; }
#join-chat .birth-confirm { width: 100%; border-radius: 30px; background: #176fbd; color: #fff; }
#join-chat .car-review-sheet { height: min(780px, calc(100dvh - 24px)); max-height: calc(100dvh - 24px); }
#join-chat .car-review-form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
#join-chat .car-review-body { flex: 1; padding: 16px 18px 24px; }
#join-chat .car-review-fields { display: grid; gap: 20px; }
#join-chat .car-field { display: grid; gap: 8px; margin: 0; font-size: 14px; }
#join-chat .car-field input, #join-chat .car-field select, #join-chat .car-plate input, #join-chat .car-plate select {
  min-height: 50px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: light-dark(#e8ebea, #323c36);
}
#join-chat .car-field select:invalid { color: light-dark(#606a64, #b8c2bc); }
#join-chat .car-plate-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
#join-chat .car-plate-heading label { margin: 0; font-size: 14px; }
#join-chat .car-plate-heading select { width: auto; min-height: 38px; padding: 4px 8px; border: 0; border-radius: 18px; font-size: 13px; background: light-dark(#e8ebea, #323c36); }
#join-chat .car-plate-set { min-width: 0; margin: 0; padding: 0; border: 0; }
#join-chat .car-plate { display: grid; grid-template-columns: 34px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
#join-chat .car-plate input, #join-chat .car-plate select { height: 52px; padding: 3px; text-align: center; }
#join-chat .car-plate-badge { display: grid; align-content: center; gap: 3px; padding: 4px; border-radius: 4px; background: #183d8e; color: #fff; font-size: 10px; line-height: 1.15; }
#join-chat .car-plate-flag { width: 20px; height: 9px; border-radius: 1px; background: linear-gradient(#238644 0 33%, #fff 33% 66%, #d73737 66%); }
#join-chat .car-plate-region { position: relative; }
#join-chat .car-plate-region input { padding-bottom: 14px; }
#join-chat .car-plate-region span { position: absolute; inset: auto 0 5px; text-align: center; font-size: 10px; color: light-dark(#53615a, #c2cdc5); pointer-events: none; }
#join-chat .car-vin { direction: ltr; text-align: right; }
#join-chat .car-owner { display: grid; gap: 14px; padding-top: 16px; border-top: 1px solid light-dark(#e1e6e2, #455048); }
#join-chat .car-owner h3 { margin: 0; font-size: 14px; }
#join-chat .car-review-footer { flex: none; padding: 10px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid light-dark(#e1e6e2, #455048); }
#join-chat .car-review-footer .send { width: 100%; }
#join-chat .car-review-footer .error:empty { display: none; }
#join-chat .application-body { padding-block: 14px; }
#join-chat .application-footer { flex: none; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid light-dark(#e1e6e2, #455048); }
#join-chat .application-footer .send { width: 100%; }
#join-chat .review-card { margin-bottom: 10px; padding: 12px; border: 1px solid light-dark(#e1e6e2, #455048); border-radius: 12px; }
#join-chat .review-card:last-child { margin-bottom: 0; }
#join-chat .review-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#join-chat .review-card h3 { margin: 0; font-size: 14px; }
#join-chat .review-card .tool { text-decoration: underline; }
#join-chat .review-values { display: grid; gap: 7px; margin: 8px 0 0; font-size: 13px; }
#join-chat .review-values div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px; }
#join-chat .review-values dt { color: light-dark(#525c55, #c1cbc4); }
#join-chat .review-values dd { margin: 0; overflow-wrap: anywhere; }
#join-chat .review-photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#join-chat .review-photos figure { flex: 1 1 118px; max-width: 50%; margin: 0; min-width: 0; }
#join-chat .review-photos img, #join-chat .review-photo-placeholder { display: grid; place-items: center; width: 100%; height: 76px; border-radius: 8px; background: light-dark(#edf2ee, #29362e); object-fit: contain; font-size: 12px; }
#join-chat .review-photos figcaption { margin-top: 4px; font-size: 11px; }
#join-chat .application-state { padding: 14px; border-radius: 12px; background: light-dark(#edf3f9, #273b4e); }
#join-chat .application-state[data-phase="correction"] { background: light-dark(#fff3df, #4a3624); }
#join-chat .application-state[data-phase="approved"] { background: light-dark(#e5f5eb, #283e31); }
#join-chat .application-state strong { font-size: 17px; }
#join-chat .application-state p, #join-chat .correction-item p { margin: 6px 0 0; font-size: 13px; line-height: 1.7; }
#join-chat .application-timeline { display: grid; gap: 13px; margin: 18px 0 8px; padding: 0; list-style: none; font-size: 13px; }
#join-chat .application-timeline li { display: flex; align-items: center; gap: 8px; }
#join-chat .correction-item { margin-top: 14px; padding: 12px; border: 1px solid light-dark(#ead0a6, #705738); border-radius: 10px; }
#join-chat .correction-item .send { margin-top: 12px; width: 100%; }
#join-chat .application-actions { display: grid; gap: 8px; margin-top: 14px; }
#join-chat .application-note { margin: 0 0 8px; font-size: 13px; line-height: 1.65; }
#join-chat .review-photos .tool { text-align: start; }
@media (min-width: 520px) and (min-height: 690px) {
  #join-chat { padding: 22px 12px; }
  #join-chat .device { height: min(820px, calc(100dvh - 44px)); box-shadow: 0 16px 50px #0002; }
}
@media (max-width: 519px) {
  #join-chat .device { max-width: none; border: 0; border-radius: 0; }
  #join-chat .sheet { width: 100%; max-width: none; margin: auto 0 0; border-radius: 16px 16px 0 0; }
  #join-chat .camera-sheet { height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
  #join-chat .car-review-sheet { height: 95dvh; max-height: 95dvh; }
}
</style>
</head>
<body>
<main id="join-chat">
  <section class="device" aria-label="گفت‌وگوی ثبت‌نام راننده">
    <header class="app-header">
      <span class="mark" aria-hidden="true">ت</span>
      <div><div class="heading">همراه ثبت‌نام تپسی</div><div class="sub" data-draft-status role="status">نسخه آزمایشی</div></div>
      <button class="progress-trigger" type="button" aria-controls="registration-chat-history">
        <span data-progress-label>پیشرفت ثبت‌نام</span><span class="sub" data-progress></span>
      </button>
    </header>
    <div class="history" id="registration-chat-history" role="log" aria-label="پیام‌های گفت‌وگو"></div>
    <div class="composer" aria-label="پاسخ به پیام"></div>
  </section>
  <dialog class="sheet city-picker" aria-labelledby="city-picker-title">
    <div class="sheet-header">
      <div class="sheet-heading">
        <h2 id="city-picker-title">شهر محل فعالیت</h2>
        <form method="dialog"><button class="tool" type="submit">بستن</button></form>
      </div>
      <input class="city-search" type="search" aria-label="جست‌وجوی شهر یا محدوده" placeholder="نام شهر یا محدوده رو جست‌وجو کن" autocomplete="off" autofocus>
    </div>
    <div class="sheet-body city-results" aria-label="شهرها و محدوده‌های فعالیت"></div>
  </dialog>
  <dialog class="sheet camera-sheet" id="photo-camera" aria-labelledby="camera-title" aria-describedby="camera-hint">
    <header class="camera-header">
      <div class="sheet-heading">
        <h2 id="camera-title"></h2>
        <button class="tool" type="button" data-camera-close autofocus>بستن</button>
      </div>
    </header>
    <div class="camera-view" data-shape="card">
      <video autoplay muted playsinline aria-hidden="true"></video>
      <div class="camera-frame" aria-hidden="true">
        <i class="camera-corner"></i><i class="camera-corner"></i><i class="camera-corner"></i><i class="camera-corner"></i>
      </div>
      <p class="camera-status" role="status" hidden></p>
    </div>
    <footer class="camera-controls">
      <p class="camera-hint" id="camera-hint"></p>
      <button class="camera-shutter" type="button" data-camera-capture disabled><span aria-hidden="true"></span>گرفتن عکس</button>
      <button class="tool camera-fallback" type="button" data-camera-fallback hidden>دوربین گوشی</button>
    </footer>
  </dialog>
  <dialog class="sheet birth-picker" id="birthdate-picker" aria-labelledby="birthdate-title">
    <div class="sheet-heading">
      <h2 id="birthdate-title">انتخاب تاریخ تولد</h2>
      <form method="dialog"><button class="tool" type="submit" aria-label="بستن">✕</button></form>
    </div>
    <div class="birth-wheels">
      <div class="birth-lane"><div class="birth-wheel" role="spinbutton" tabindex="0" data-part="day" aria-label="روز"></div></div>
      <div class="birth-lane"><div class="birth-wheel" role="spinbutton" tabindex="0" data-part="month" aria-label="ماه"></div></div>
      <div class="birth-lane"><div class="birth-wheel" role="spinbutton" tabindex="0" data-part="year" aria-label="سال"></div></div>
    </div>
    <button class="send birth-confirm" type="button" data-birthdate-confirm>تأیید</button>
  </dialog>
  <dialog class="sheet car-review-sheet" id="car-review" aria-labelledby="car-review-title">
    <header class="sheet-header">
      <div class="sheet-heading">
        <h2 id="car-review-title">بررسی اطلاعات خودرو</h2>
        <form method="dialog"><button class="tool" type="submit" autofocus>بستن</button></form>
      </div>
      <div class="sub">اطلاعات مدرک رو بررسی کن و موارد خالی رو کامل کن.</div>
    </header>
    <form class="car-review-form">
      <div class="sheet-body car-review-body" data-car-fields></div>
      <footer class="car-review-footer">
        <button class="send" type="submit">تأیید اطلاعات خودرو</button>
        <div class="error" role="alert" data-car-error></div>
      </footer>
    </form>
  </dialog>
  <dialog class="sheet" id="final-review" aria-labelledby="final-review-title">
    <header class="sheet-header">
      <div class="sheet-heading">
        <h2 id="final-review-title">مرور نهایی ثبت‌نام</h2>
        <form method="dialog"><button class="tool" type="submit" autofocus>بستن</button></form>
      </div>
      <div class="sub">قبل از ارسال، اطلاعات و تصویر مدارکت رو بررسی کن.</div>
    </header>
    <div class="sheet-body application-body" data-final-review></div>
    <footer class="application-footer">
      <p class="application-note" data-review-note hidden></p>
      <button class="send" type="button" data-submit-application>ارسال برای بررسی</button>
    </footer>
  </dialog>
  <dialog class="sheet" id="application-status" aria-labelledby="application-status-title">
    <header class="sheet-header">
      <div class="sheet-heading">
        <h2 id="application-status-title">وضعیت ثبت‌نام</h2>
        <form method="dialog"><button class="tool" type="submit" autofocus>بستن</button></form>
      </div>
      <div class="sub">نتیجه بررسی آزمایشی</div>
    </header>
    <div class="sheet-body application-body" data-application-status aria-live="polite"></div>
  </dialog>
</main>
<script>
(() => {
const app = document.querySelector('#join-chat');
const history = app.querySelector('.history');
const composer = app.querySelector('.composer');
const progress = app.querySelector('[data-progress]');
let progressWidgetCount = 0;
let activeProgressWidget = null;
let showingProgress = false;
const cityPicker = app.querySelector('.city-picker');
const citySearch = cityPicker.querySelector('.city-search');
const cityResults = cityPicker.querySelector('.city-results');
const cameraSheet = app.querySelector('#photo-camera');
const cameraView = cameraSheet.querySelector('.camera-view');
const cameraVideo = cameraView.querySelector('video');
const cameraStatus = cameraView.querySelector('.camera-status');
const cameraCapture = cameraSheet.querySelector('[data-camera-capture]');
const cameraFallback = cameraSheet.querySelector('[data-camera-fallback]');
const birthPicker = app.querySelector('#birthdate-picker');
const birthWheels = [...birthPicker.querySelectorAll('.birth-wheel')];
const carReview = app.querySelector('#car-review');
const carReviewForm = carReview.querySelector('.car-review-form');
const carReviewFields = carReview.querySelector('[data-car-fields]');
const finalReview = app.querySelector('#final-review');
const finalReviewBody = finalReview.querySelector('[data-final-review]');
const statusSheet = app.querySelector('#application-status');
const statusBody = statusSheet.querySelector('[data-application-status]');
let carReviewSource;
let openCarReviewAfterReply = false;
const birthdateLabel = 'تاریخ تولد';
const birthYearMin = 1300;
const persianMonths = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const persianCalendar = new Intl.DateTimeFormat('en-US', {
  calendar: 'persian', numberingSystem: 'latn', timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric',
});
let birthToday;
let birthDraft;
let cameraSession = 0;
let cameraStream = null;
const tasks = {
  personal: ['اطلاعات شخصی', 'می‌خوام اطلاعات شخصی‌مو ثبت کنم.'],
  license: ['گواهینامه', 'می‌خوام گواهینامه‌مو ثبت کنم.'],
  car: ['اطلاعات خودرو', 'بریم سراغ اطلاعات خودرو.'],
  live: ['عکس زنده', 'می‌خوام عکس چهره‌مو بگیرم.'],
};
const progressIcons = {
  personal: '<circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',
  license: '<rect x="2.5" y="5" width="19" height="14" rx="3"/><circle cx="8" cy="10" r="1.5"/><path d="M5.5 15a2.5 2.5 0 0 1 5 0m3-5h4.5m-4.5 4h4.5"/>',
  car: '<path d="m4 11 2-5h12l2 5M4 17v2m16-2v2"/><rect x="3" y="11" width="18" height="6" rx="2"/><path d="M7 14h.01m9.99 0h.01"/>',
  live: '<path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><circle cx="12" cy="12" r="4"/>',
};
const fields = [
  { key: 'city', label: 'شهر فعالیت', question: 'دوست داری توی کدوم شهر فعالیت کنی؟' },
  { key: 'identity', label: 'کد ملی', question: 'کد ملی‌ات رو می‌فرستی؟' },
  { key: 'father', label: 'نام پدر', question: 'اسم پدرت رو می‌نویسی؟' },
  { key: 'address', label: 'نشانی', question: 'نشانی محل سکونتت رو می‌نویسی؟' },
];
const serviceAreas = [
  { name: 'تهران', covered: ['دماوند', 'اسلامشهر', 'لواسان', 'پاکدشت', 'پردیس', 'قدس', 'ری', 'رباط کریم', 'شهریار', 'ورامین'] },
  { name: 'کرج', covered: ['چهارباغ', 'اشتهارد', 'فردیس', 'هشتگرد', 'ملارد', 'نظر آباد', 'ساوجبلاغ'] },
  { name: 'اصفهان', covered: ['بهارستان', 'برخوار', 'فلاورجان', 'خمینی شهر', 'لنجان', 'مبارکه', 'نجف آباد', 'قهاب', 'شاهین شهر'] },
  { name: 'مشهد', covered: ['احمد آباد', 'چناران', 'درزآب', 'گلبهار', 'کنویست', 'مینا ولایت', 'رضویه', 'تبادکان', 'طرقبه'] },
  { name: 'تبریز', covered: ['آذر شهر', 'اسکو'] },
  { name: 'شیراز', covered: ['مرودشت', 'زرقان'] },
];
const standaloneCities = ['رشت', 'اهواز', 'لنگرود', 'لشت‌نشا', 'لیسار', 'نوشهر', 'پره‌سر', 'رامسر',
  'رضوان‌شهر', 'رودسر', 'سلمان‌شهر', 'شیرود', 'تنکابن', 'بهشهر'];
const cities = [...serviceAreas, ...standaloneCities.map(name => ({ name, covered: [] }))];
const documentTypes = {
  license: { card: 'کارت گواهینامه', receipt: 'رسید گواهینامه' },
  car: { card: 'کارت خودرو', green: 'برگ سبز' },
};
const sampleDetails = {
  license: { 'نام و نام خانوادگی': 'علی نمونه', [birthdateLabel]: '۱۳۶۹/۰۱/۰۱' },
  car: {
    'پلاک': '۱۲ ب ۳۴۵ ایران ۶۷', 'نوع خودرو': 'پژو ۲۰۷', 'مدل': '',
    'رنگ': '', 'شماره شاسی': 'DEMA207A8PJ012345', 'نام مالک': 'علی نمونه', 'کد ملی مالک': '۰۰۰۰۰۰۰۰۰۰',
  },
};
const answers = {};
const documents = { license: { images: {} }, car: { images: {} }, live: { images: {} } };
const personalDrafts = {};
const licenseDraft = {};
const carDraft = {};
const restoredPhotoSections = new Set();
const draftStatus = app.querySelector('[data-draft-status]');
const draftStore = 'drafts';
let draftDatabase;
let savedMode;
let task = null;
let field = null;
let mode = 'tasks';
let previousMode = 'tasks';
let editing = false;
let pendingPhoto = null;
let application = null;
let applicationEditing = false;
let replacement = null;
let reviewTimer;
const demoReviewDelay = 7000;
const reviewLabels = { reviewing: 'در حال بررسی', correction: 'نیاز به اصلاح', rechecking: 'در حال بررسی مجدد', approved: 'تأیید شد' };
const botQueue = [];
let isBotTyping = false;

const escape = value => String(value).replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
})[char]);

function openDraftDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('tapsi-join-chat-env', 1);
    request.onupgradeneeded = () => request.result.createObjectStore(draftStore);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Draft storage is blocked'));
  });
}

function readDraft() {
  return new Promise((resolve, reject) => {
    const request = draftDatabase.transaction(draftStore).objectStore(draftStore).get('registration');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function writeDraft(draft) {
  return new Promise((resolve, reject) => {
    const transaction = draftDatabase.transaction(draftStore, 'readwrite');
    const store = transaction.objectStore(draftStore);
    if (draft) store.put(draft, 'registration');
    else store.delete('registration');
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
  });
}

function photoData(photo) {
  if (!photo) return null;
  return photo.sample ? { sample: true } : { blob: photo.blob };
}

function photoPreview(photo) {
  if (!photo?.blob) return photo;
  return { blob: photo.blob, url: URL.createObjectURL(photo.blob) };
}

function showDraftStatus(message) {
  if (draftStatus.textContent !== message) draftStatus.textContent = message;
}

function saveDraft() {
  if (!draftDatabase || !task) return;
  const savedDocuments = Object.fromEntries(Object.entries(documents).map(([key, item]) => [key, {
    ...item, images: Object.fromEntries(Object.entries(item.images).map(([side, photo]) => [side, photoData(photo)])),
  }]));
  writeDraft({
    version: 1, task, field: field?.key, mode: mode === 'welcome-back' ? savedMode : mode, previousMode, editing,
    application, applicationEditing, replacement,
    answers, personalDrafts, licenseDraft, carDraft, documents: savedDocuments, pendingPhoto: photoData(pendingPhoto),
  }).then(() => showDraftStatus('پیش‌نویس روی دستگاه ذخیره شد'))
    .catch(() => showDraftStatus('ذخیره پیش‌نویس انجام نشد'));
}

function restoreDraft(draft) {
  if (draft?.version !== 1 || !Object.hasOwn(tasks, draft.task)) return false;
  Object.assign(answers, draft.answers);
  Object.assign(personalDrafts, draft.personalDrafts);
  Object.assign(licenseDraft, draft.licenseDraft);
  Object.assign(carDraft, draft.carDraft);
  for (const key of Object.keys(documents)) {
    const saved = draft.documents[key];
    Object.assign(documents[key], saved, {
      images: Object.fromEntries(Object.entries(saved.images).map(([side, photo]) => [side, photoPreview(photo)])),
    });
    if (Object.keys(saved.images).length) restoredPhotoSections.add(key);
  }
  task = draft.task;
  field = fields.find(item => item.key === draft.field) || null;
  editing = draft.editing;
  application = Object.hasOwn(reviewLabels, draft.application?.phase) ? draft.application :
    (draft.submitted ? newApplicationReview() : null);
  const legacyCorrection = Boolean(draft.correctingDocument) && application?.phase === 'correction';
  applicationEditing = Boolean(application && (draft.applicationEditing || legacyCorrection));
  replacement = draft.replacement || (legacyCorrection ? { key: 'license', side: application.flagSide } : null);
  if (application && application.phase === 'correction' && !application.feedback) {
    application.feedback = [{ kind: 'photo', edited: false }];
  }
  previousMode = draft.previousMode;
  pendingPhoto = photoPreview(draft.pendingPhoto);
  savedMode = draft.mode;
  mode = 'welcome-back';
  return true;
}

function showRestoredPhotos(key) {
  if (!restoredPhotoSections.delete(key)) return;
  for (const [side, photo] of Object.entries(documents[key].images)) driver(imageLabel(key, side), { photo });
}

function continueDraft() {
  if (application && !applicationEditing) {
    mode = 'submitted';
    openApplicationStatus();
    return;
  }
  mode = savedMode === 'tasks' ? previousMode : savedMode;
  if (replacement) {
    if (mode === 'photo' && pendingPhoto) previewPhoto(pendingPhoto);
    else askPhoto();
    return;
  }
  showRestoredPhotos(task);
  if (mode === 'field' && field) askField(field, editing);
  else if (mode === 'photo' && pendingPhoto) previewPhoto(pendingPhoto);
  else if (mode === 'review' || mode === 'upload' || mode === 'doctype') chooseTask(task);
  else if (mode !== 'fields') {
    const next = Object.keys(tasks).find(key => !isComplete(key));
    if (next) chooseTask(next);
    else mode = 'tasks';
  }
}

function newApplicationReview() {
  return {
    phase: 'reviewing', dueAt: Date.now() + demoReviewDelay, submittedAddress: answers.address,
    flagSide: documents.license.type === 'card' ? 'back' : 'single', feedback: [],
  };
}

function reviewValues(values) {
  return '<dl class="review-values">' + Object.entries(values).map(([label, value]) => {
    const display = /کد ملی/.test(label) ? '••••••' + value.slice(-4) : value;
    return '<div><dt>' + escape(label) + '</dt><dd>' + escape(display) + '</dd></div>';
  }).join('') + '</dl>';
}

function reviewPhotos(key) {
  return '<div class="review-photos">' + Object.entries(documents[key].images).map(([side, photo]) => {
    const label = escape(imageLabel(key, side));
    const preview = photo.url ? '<img src="' + escape(photo.url) + '" alt="' + label + '">' :
      '<div class="review-photo-placeholder">تصویر نمونه</div>';
    return '<figure>' + preview + '<figcaption>' + label + '</figcaption>' +
      '<button class="tool" type="button" data-replace-section="' + key + '" data-replace-side="' + side +
      '" aria-label="جایگزینی ' + label + '">جایگزینی تصویر</button></figure>';
  }).join('') + '</div>';
}

function openFinalReview() {
  if ((application && !applicationEditing) || !Object.keys(tasks).every(isComplete)) return;
  finalReview.querySelector('#final-review-title').textContent = application ? 'مرور تغییرات ثبت‌نام' : 'مرور نهایی ثبت‌نام';
  const personal = Object.fromEntries(fields.map(item => [item.label, answers[item.key]]));
  finalReviewBody.innerHTML = Object.keys(tasks).map(key => {
    const edit = key === 'live' ? '' : '<button class="tool" type="button" data-edit-section="' + key + '">ویرایش</button>';
    const values = key === 'personal' ? reviewValues(personal) : documents[key].details ? reviewValues(documents[key].details) : '';
    const photos = key === 'personal' ? '' : reviewPhotos(key);
    return '<section class="review-card"><div class="review-card-heading"><h3>' + escape(titles(key)) + '</h3>' + edit +
      '</div>' + values + photos + '</section>';
  }).join('');
  syncReviewSubmit();
  finalReview.showModal();
  finalReviewBody.scrollTop = 0;
}

function missingCorrections() {
  return application?.phase === 'correction' ? application.feedback.filter(item => !item.edited).length : 0;
}

function syncReviewSubmit() {
  const missing = missingCorrections();
  const submit = finalReview.querySelector('[data-submit-application]');
  const note = finalReview.querySelector('[data-review-note]');
  submit.textContent = application ? 'ارسال مجدد برای بررسی' : 'ارسال برای بررسی';
  submit.disabled = Boolean(missing);
  note.hidden = !missing;
  note.textContent = missing ? persian(missing) + ' مورد از بازخورد بررسی هنوز نیاز به اصلاح داره.' : '';
}

function renderApplicationStatus() {
  const { phase, flagSide } = application;
  const messages = {
    reviewing: 'درخواست ثبت‌نام دریافت شد. داریم مدارک رو بررسی می‌کنیم.',
    correction: 'بازخورد هر مورد رو ببین، اصلاحش کن و تغییرات رو برای بررسی بفرست.',
    rechecking: 'تغییرات ثبت شد و دوباره بررسی می‌شه.',
    approved: 'بررسی آزمایشی ثبت‌نام با موفقیت انجام شد.',
  };
  const timeline = [
    ['درخواست دریافت شد', true],
    [phase === 'correction' ? 'بررسی اولیه انجام شد' : reviewLabels[phase], phase === 'correction' || phase === 'approved'],
  ];
  const marker = (done) => '<span class="progress-check"' + (done ? ' data-filled>✓' : '>') + '</span>';
  statusBody.innerHTML = '<section class="application-state" data-phase="' + phase + '"><strong>' + reviewLabels[phase] +
    '</strong><p>' + messages[phase] + '</p></section><ul class="application-timeline">' +
    timeline.map(([label, done]) => '<li>' + marker(done) + label + '</li>').join('') + '</ul>';
  if (phase === 'correction') {
    const feedback = application.feedback.map(item => {
      const isPhoto = item.kind === 'photo';
      const label = isPhoto ? imageLabel('license', flagSide) : 'نشانی محل سکونت';
      const reason = isPhoto ? 'نوشته‌های تصویر خوانا نیست. یه عکس واضح‌تر بفرست.' :
        'نشانی ناقصه. نام خیابون و پلاک رو به نشانی اضافه کن.';
      const edited = item.edited ? '<p>✓ تغییر ذخیره شد و آماده ارساله.</p>' : '';
      return '<section class="correction-item"><strong>' + escape(label) + '</strong><p>' + reason + '</p>' + edited +
        '<button class="send" type="button" data-fix-item="' + item.kind + '">' +
        (isPhoto ? 'اصلاح همین مدرک' : 'اصلاح نشانی') + '</button></section>';
    }).join('');
    statusBody.insertAdjacentHTML('beforeend', feedback);
  }
  statusBody.insertAdjacentHTML('beforeend', '<div class="application-actions"><button class="option" type="button" data-edit-application>' +
    (applicationEditing ? 'مرور و ارسال مجدد' : 'ویرایش اطلاعات و مدارک') + '</button></div>');
}

function refreshApplicationStatus() {
  clearTimeout(reviewTimer);
  if (!application) return;
  const phase = application.phase;
  if (phase === 'reviewing' || phase === 'rechecking') {
    const remaining = application.dueAt - Date.now();
    if (remaining > 0) reviewTimer = setTimeout(refreshApplicationStatus, remaining);
    else {
      application.phase = phase === 'reviewing' ? 'correction' : 'approved';
      if (phase === 'reviewing') {
        const original = application.submittedAddress ?? answers.address;
        application.feedback = [{ kind: 'photo', edited: false },
          { kind: 'address', original, edited: answers.address !== original }];
      }
      saveDraft();
    }
  }
  progress.textContent = reviewLabels[application.phase];
  if (statusSheet.open) renderApplicationStatus();
  if (finalReview.open) syncReviewSubmit();
}

function openApplicationStatus() {
  if (!application || statusSheet.open) return;
  refreshApplicationStatus();
  renderApplicationStatus();
  statusSheet.showModal();
}

function startPhotoReplacement(key, side) {
  if (!documents[key]?.images[side]) return;
  if (finalReview.open) finalReview.close();
  if (statusSheet.open) statusSheet.close();
  task = key;
  applicationEditing = Boolean(application);
  replacement = { key, side };
  pendingPhoto = null;
  askPhoto();
  render();
}

finalReviewBody.addEventListener('click', event => {
  const replace = event.target.closest('[data-replace-section]');
  if (replace) {
    startPhotoReplacement(replace.dataset.replaceSection, replace.dataset.replaceSide);
    return;
  }
  const edit = event.target.closest('[data-edit-section]');
  if (!edit) return;
  finalReview.close();
  handleAction('task:' + edit.dataset.editSection);
});

finalReview.querySelector('[data-submit-application]').addEventListener('click', () => {
  if ((application && !applicationEditing) || missingCorrections() || !Object.keys(tasks).every(isComplete)) return;
  finalReview.close();
  const resubmitting = Boolean(application);
  if (resubmitting) {
    if (application.phase !== 'reviewing') application.phase = 'rechecking';
    application.dueAt = Date.now() + demoReviewDelay;
    application.submittedAddress = answers.address;
  } else application = newApplicationReview();
  applicationEditing = false;
  replacement = null;
  pendingPhoto = null;
  mode = 'submitted';
  driver(resubmitting ? 'تغییرات رو برای بررسی می‌فرستم.' : 'ثبت‌نام رو برای بررسی می‌فرستم.');
  bot(resubmitting ? 'تغییرات ارسال شد. نتیجه رو از وضعیت ثبت‌نام دنبال کن.' :
    'درخواست ثبت شد. نتیجه رو از وضعیت ثبت‌نام دنبال کن.');
  render();
  openApplicationStatus();
});

statusBody.addEventListener('click', event => {
  const fix = event.target.closest('[data-fix-item]');
  if (fix?.dataset.fixItem === 'photo') startPhotoReplacement('license', application.flagSide);
  else if (fix?.dataset.fixItem === 'address') {
    statusSheet.close();
    applicationEditing = true;
    askField(fields.find(item => item.key === 'address'), true);
    render();
  } else if (event.target.closest('[data-edit-application]')) {
    statusSheet.close();
    applicationEditing = true;
    replacement = null;
    pendingPhoto = null;
    mode = 'done';
    render();
    openFinalReview();
  }
});

async function resetDraft() {
  if (!window.confirm('ثبت‌نام از اول شروع بشه؟ پیش‌نویس روی این دستگاه پاک می‌شه.')) return;
  clearTimeout(reviewTimer);
  try {
    if (draftDatabase) await writeDraft(null);
    window.location.reload();
  } catch {
    showDraftStatus('پاک کردن پیش‌نویس انجام نشد');
    refreshApplicationStatus();
  }
}

function addMessage(who, text, options = {}) {
  const bubble = document.createElement('div');
  bubble.className = 'message ' + who;
  bubble.setAttribute('aria-label', (who === 'driver' ? 'راننده، ' : 'تپسی، ') + text);
  bubble.textContent = text;
  if (options.photo?.url) {
    const image = document.createElement('img');
    image.className = 'bubble-photo';
    image.src = options.photo.url;
    image.alt = 'تصویر انتخاب‌شده';
    bubble.append(image);
  }
  if (options.photo?.sample) {
    const sample = document.createElement('div');
    sample.className = 'sample';
    sample.textContent = 'تصویر نمونه';
    bubble.append(sample);
  }
  if (options.edit) {
    const edit = document.createElement('button');
    edit.className = 'editor link';
    edit.type = 'button';
    edit.textContent = 'ویرایش';
    edit.addEventListener('click', options.edit);
    bubble.append(edit);
  }
  if (options.progressWidget) {
    bubble.classList.add('progress-message');
    activeProgressWidget = createProgressWidget();
    bubble.append(activeProgressWidget);
  }
  history.append(bubble);
  scrollToLatestMessage();
}

function scrollToLatestMessage() {
  const latest = history.lastElementChild;
  if (latest?.classList.contains('progress-message') && latest.offsetHeight > history.clientHeight) {
    history.scrollTop += latest.getBoundingClientRect().top - history.getBoundingClientRect().top;
  } else history.scrollTop = history.scrollHeight;
}

function bot(text, options) {
  botQueue.push({ text, options });
  if (isBotTyping) return;
  isBotTyping = true;
  composer.inert = true;
  history.querySelectorAll('button.editor').forEach(button => { button.disabled = true; });
  showNextBotMessage();
}

function showNextBotMessage() {
  const message = botQueue.shift();
  if (!message) {
    isBotTyping = false;
    composer.inert = false;
    history.querySelectorAll('button.editor').forEach(button => { button.disabled = Boolean(application); });
    render(false);
    return;
  }

  const typing = document.createElement('div');
  typing.className = 'message assistant typing';
  typing.setAttribute('role', 'status');
  typing.setAttribute('aria-label', 'تپسی در حال نوشتن است');
  typing.innerHTML = '<span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>';
  history.append(typing);
  history.scrollTop = history.scrollHeight;

  const delay = Math.min(950, 420 + message.text.length * 4);
  setTimeout(() => {
    typing.remove();
    addMessage('assistant', message.text, message.options);
    showNextBotMessage();
  }, delay);
}

const driver = (text, options) => addMessage('driver', text, options);
const persian = value => Number(value).toLocaleString('fa-IR');

function isComplete(key) {
  if (key === 'personal') return fields.every(item => answers[item.key]);
  if (key === 'live') return Boolean(documents.live.images.face);
  return Boolean(documents[key].details);
}

function taskStatus(key) {
  if (isComplete(key)) return 'تکمیل شده ✓';
  if (key === 'personal') return persian(Object.keys(answers).length) + ' از ۴';
  return Object.keys(documents[key].images).length ? 'در حال تکمیل' : '';
}

function progressSteps(key) {
  if (key === 'personal') {
    return fields.map(item => ({ label: item.label, filled: Boolean(answers[item.key]) }));
  }
  const { images, type, details } = documents[key];
  if (key === 'live') return [{ label: 'عکس زنده چهره', filled: Boolean(images.face) }];

  const photoSteps = type
    ? imageKeys(key).map(side => ({ label: imageLabel(key, side), filled: Boolean(images[side]) }))
    : [{ label: 'تصویر مدرک', filled: false }];
  return [{ label: 'انتخاب نوع مدرک', filled: Boolean(type) }, ...photoSteps,
    { label: 'تأیید اطلاعات مدرک', filled: Boolean(details) }];
}

function missingDocumentFields(key) {
  if ((key !== 'car' && key !== 'license') || isComplete(key) || !documents[key].type || nextImage(key)) return [];
  const sample = sampleDetails[key];
  if (key === 'license') return Object.entries({ ...sample, ...licenseDraft }).filter(([, value]) => !value.trim()).map(([label]) => label);
  const carFields = { vehicle: 'نوع خودرو', year: 'مدل', color: 'رنگ', vin: 'شماره شاسی', owner: 'نام مالک', 'owner-id': 'کد ملی مالک' };
  const missing = Object.entries(carFields).filter(([name, label]) => !(carDraft[name] ?? sample[label]).trim()).map(([, label]) => label);
  const plate = carDraft['plate-type'] === 'other' ? ['plate-other'] : ['plate-first', 'plate-letter', 'plate-serial', 'plate-region'];
  if (plate.some(name => Object.hasOwn(carDraft, name) && !carDraft[name].trim()) ||
      (carDraft['plate-type'] === 'other' && !carDraft['plate-other']?.trim())) missing.unshift('پلاک');
  return missing;
}

function createProgressWidget() {
  const widget = document.createElement('section');
  widget.className = 'progress-widget';
  widget.id = 'progress-widget-' + ++progressWidgetCount;
  widget.dataset.section = task || Object.keys(tasks).find(key => !isComplete(key)) || 'personal';
  widget.setAttribute('aria-label', 'پیشرفت ثبت‌نام');
  renderProgressWidget(widget);
  return widget;
}

function renderProgressWidget(widget) {
  const keys = Object.keys(tasks);
  const selected = widget.dataset.section;
  const complete = keys.filter(isComplete).length;
  const detailId = widget.id + '-detail';
  const cards = keys.map(key => {
    const steps = progressSteps(key);
    const filled = steps.filter(step => step.filled).length;
    let status = 'شروع نشده';
    if (isComplete(key)) status = 'تکمیل شده';
    else if (filled) status = persian(filled) + ' از ' + persian(steps.length) + ' مورد';
    const icon = '<svg class="progress-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"' +
      ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + progressIcons[key] + '</svg>';
    const track = steps.map(step => '<span' + (step.filled ? ' data-filled' : '') + '></span>').join('');
    const check = isComplete(key) ? '<span class="progress-check" data-filled aria-hidden="true">✓</span>' : '';
    return '<div class="progress-card" data-section="' + key + '"' + (key === selected ? ' data-selected' : '') + '>' +
      '<span class="progress-card-top">' + icon + check + '</span><span class="progress-card-title">' + escape(titles(key)) + '</span>' +
      '<span class="progress-track" aria-hidden="true">' + track + '</span><span class="progress-caption">' + status + '</span></div>';
  }).join('');
  const chips = progressSteps(selected).map(({ label, filled }) => {
    const status = filled ? 'ثبت شده' : 'باقی مانده';
    const marker = '<span class="progress-check"' + (filled ? ' data-filled' : '') + ' aria-hidden="true">' + (filled ? '✓' : '') + '</span>';
    return '<li><span class="progress-step"' + (filled ? ' data-filled' : '') + '>' +
      marker + escape(label) + '<span class="progress-status-text">، ' + status + '</span></span></li>';
  }).join('');
  const missing = missingDocumentFields(selected);
  const remaining = missing.length ? '<p class="application-note">موارد خالی · ' + missing.map(escape).join('، ') + '</p>' : '';
  widget.innerHTML = '<div class="sub">' + persian(complete) + ' از ۴ بخش تکمیل شده</div>' +
    '<div class="progress-map" role="group" aria-label="بخش‌های ثبت‌نام">' + cards + '</div>' +
    '<section class="progress-detail" id="' + detailId + '" aria-labelledby="' + detailId + '-title">' +
    '<h3 id="' + detailId + '-title">' + escape(titles(selected)) + '</h3>' +
    '<ul class="progress-steps">' + chips + '</ul>' + remaining + '</section>';
}

progressTrigger.addEventListener('click', () => {

function controls(personal = false) {

function renderProgressControls(widget) {
  const selected = widget.dataset.section;
  const sections = Object.keys(tasks).map(key =>

    actions = option(isComplete(selected) ? 'مرور اطلاعات' : 'ادامه این بخش', 'task:' + selected);
  }
  const back = mode === 'field' ? 'بازگشت به ' + field.label : 'بازگشت به مرحله قبلی';
