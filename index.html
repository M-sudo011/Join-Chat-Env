    '<select id="progress-section" aria-controls="' + widget.id + '-detail">' + sections + '</select>' +
    actions + '<div class="tools">' + smallAction(back, 'return-from-progress') + '</div></div>';
  composer.querySelector('#progress-section').onchange = event => {
    widget.dataset.section = event.currentTarget.value;
    render(false);
    composer.querySelector('#progress-section').focus({ preventScroll: true });
  };
}

function normalizeCityName(name) {
  return name.normalize('NFKC').replace(/[يى]/g, 'ی').replace(/ك/g, 'ک')
    .replace(/آ/g, 'ا').replace(/[\s\u200c\u200d\u0640\u064b-\u065f-]/g, '');
}

function searchCities(query) {
  const term = normalizeCityName(query);
  const matches = [];
  for (const city of cities) {
    const name = normalizeCityName(city.name);
    const covered = term ? city.covered.filter(place => normalizeCityName(place).includes(term)) : city.covered;
    if (term && !name.includes(term) && !covered.length) continue;
    const candidates = [name, ...covered.map(normalizeCityName)];
    let rank = 3;
    if (!term || name === term) rank = 0;
    else if (candidates.includes(term)) rank = 1;
    else if (candidates.some(candidate => candidate.startsWith(term))) rank = 2;
    matches.push({ name: city.name, covered, rank });
  }
  return matches.sort((first, second) => first.rank - second.rank);
}

function renderCityResults() {
  const query = citySearch.value;
  const matches = searchCities(query);
  const rows = matches.map(city => {
    const coverage = city.covered.length
      ? '<span class="city-coverage">تحت پوشش · ' + escape(city.covered.join('، ')) + '</span>'
      : '';
    return '<button class="city-result" type="button" data-city="' + escape(city.name) + '">' +
      escape(city.name) + coverage + '</button>';
  });
  if (!matches.length) rows.push('<p class="city-empty" role="status">شهری با این نام پیدا نشد. املای دیگه‌ای رو امتحان کن یا «سایر» رو انتخاب کن.</p>');
  if (!normalizeCityName(query) || !matches.length) {
    rows.push('<button class="city-result" type="button" data-city="سایر">سایر</button>');
  }
  cityResults.innerHTML = rows.join('');
  cityResults.scrollTop = 0;
}

function openCityPicker() {
  citySearch.value = '';
  renderCityResults();
  cityPicker.showModal();
}

citySearch.addEventListener('input', renderCityResults);
cityResults.addEventListener('click', event => {
  const result = event.target.closest('button[data-city]');
  if (!result || mode !== 'field' || field.key !== 'city' || isBotTyping) return;
  cityPicker.close();
  commitAnswer(result.dataset.city);
});

function inputForField() {
  const value = personalDrafts[field.key] ?? answers[field.key] ?? '';
  if (field.key === 'address') return '<textarea id="answer" rows="2" required>' + escape(value) + '</textarea>';
  const numeric = field.key === 'identity' ? ' inputmode="numeric" maxlength="10"' : '';
  return '<input id="answer" required' + numeric + ' value="' + escape(value) + '" autocomplete="off">';
}

function render(persist = true) {
  const complete = Object.keys(tasks).filter(isComplete).length;
  const reviewAction = applicationEditing ? 'مرور و ارسال مجدد' : 'مرور و ارسال';
  progress.textContent = application ? reviewLabels[application.phase] : persian(complete) + ' از ۴ بخش';
  progressTrigger.querySelector('[data-progress-label]').textContent = application ? 'وضعیت ثبت‌نام' : 'پیشرفت ثبت‌نام';
  progressTrigger.setAttribute('aria-controls', application ? 'application-status' : 'registration-chat-history');
  if (application) progressTrigger.setAttribute('aria-haspopup', 'dialog');
  else progressTrigger.removeAttribute('aria-haspopup');
  if (persist) saveDraft();
  if (isBotTyping) return;
  history.querySelectorAll('.progress-widget').forEach(renderProgressWidget);
  if (showingProgress) {
    renderProgressControls(activeProgressWidget);
  } else if (mode === 'welcome-back') {
    let label = application ? 'مشاهده وضعیت ثبت‌نام' : 'ادامه ثبت‌نام';
    if (applicationEditing || replacement) label = 'ادامه ویرایش ثبت‌نام';
    composer.innerHTML = options('ثبت‌نام قبلی روی این دستگاه ذخیره شده', option(label, 'continue-draft')) +
      '<div class="tools">' + smallAction('شروع دوباره', 'reset-draft') + '</div>';
  } else if (mode === 'submitted') {
    composer.innerHTML = options('پیگیری درخواست', option('مشاهده وضعیت ثبت‌نام', 'view-status')) +
      '<div class="tools">' + smallAction('شروع دوباره', 'reset-draft') + '</div>';
  } else if (mode === 'tasks') {
    const taskButtons = Object.entries(tasks).map(([key, [label]]) => option(label, 'task:' + key, taskStatus(key)));
    if (complete === 4) taskButtons.unshift(option(reviewAction, 'final-review'));
    composer.innerHTML = options('از کدوم بخش ادامه بدیم؟', taskButtons.join(''));
    if (task && previousMode !== 'tasks') {
      composer.insertAdjacentHTML('beforeend', '<div class="tools">' + smallAction('برگشت به گفت‌وگو', 'resume') + '</div>');
    }
    if (task) composer.insertAdjacentHTML('beforeend', '<div class="tools">' + smallAction('شروع دوباره', 'reset-draft') + '</div>');
  } else if (mode === 'field' && field.key === 'city') {
    composer.innerHTML = '<label for="choose-city">' + field.label + '</label>' +
      '<button id="choose-city" class="option city-trigger" type="button" aria-haspopup="dialog">جست‌وجو و انتخاب شهر</button>' + controls(true);
    composer.querySelector('#choose-city').onclick = openCityPicker;
  } else if (mode === 'field') {
    composer.innerHTML = '<form><label for="answer">' + field.label + '</label><div class="entry">' +
      inputForField() + '<button class="send" type="submit">ارسال</button></div><div class="error" role="alert"></div></form>' +
      controls(true);
    composer.querySelector('form').onsubmit = submitAnswer;
  } else if (mode === 'fields') {
    const buttons = fields.map(item => option(item.label, 'field:' + item.key, answers[item.key] ? 'ثبت شده ✓' : ''));
    composer.innerHTML = options('کدوم مورد رو ثبت یا ویرایش کنیم؟', buttons.join('')) + controls();
  } else if (mode === 'doctype') {
    const buttons = Object.entries(documentTypes[task]).map(([key, label]) => option(label + ' دارم', 'type:' + key));
    composer.innerHTML = options('نوع مدرک', buttons.join('')) + controls();
  } else if (mode === 'upload') {
    const gallery = task === 'live' ? '' : '<button class="option" type="button" data-action="gallery">گالری</button>';
    composer.innerHTML = '<div class="composer-title">' + imageLabel() + '</div><div class="upload">' +
      '<button class="send" type="button" data-action="camera">گرفتن عکس</button>' + gallery +
      '<button class="option" type="button" data-action="sample">تصویر نمونه</button></div>' +
      '<input type="file" accept="image/*" id="camera" capture="' + (task === 'live' ? 'user' : 'environment') + '">' +
      '<input type="file" accept="image/*" id="gallery">' + controls();
    composer.querySelectorAll('input[type=file]').forEach(input => {
      input.onchange = () => {
        if (input.files.length) previewPhoto({ blob: input.files[0] });
      };
    });
  } else if (mode === 'photo') {
    const keep = replacement ? 'ذخیره تصویر جایگزین' : 'بله، همین تصویر';
    composer.innerHTML = options('تصویر رو تأیید می‌کنی؟',
      option(keep, 'keep') + option('دوباره انتخاب می‌کنم', 'retake')) + controls();
  } else if (mode === 'review') {
    renderReview();
  } else {
    const next = complete === 4 ? option(reviewAction, 'final-review') + option('بازگشت به بخش‌ها', 'tasks') :
      option('بخش بعدی رو انتخاب می‌کنم', 'tasks');
    composer.innerHTML = options(complete === 4 ? 'همه بخش‌ها تکمیل شده' : 'ادامه ثبت‌نام', next);
  }
  composer.querySelectorAll('[data-action]').forEach(button => {
    button.onclick = () => handleAction(button.dataset.action);
  });
  scrollToLatestMessage();
  if (!showingProgress && openCarReviewAfterReply && task === 'car' && mode === 'review') {
    openCarReviewAfterReply = false;
    openCarReview();
  }
}

function askField(item, edit = false) {
  showingProgress = false;
  if (task !== 'personal') pendingPhoto = null;
  replacement = null;
  task = 'personal';
  field = item;
  editing = edit;
  mode = 'field';
  bot(edit ? item.label + ' رو دوباره بفرست.' : item.question);
}

function nextField() {
  const next = fields.find(item => !answers[item.key]);
  if (next) {
    askField(next);
  } else {
    bot('اطلاعات شخصی‌ات تکمیل شد. دوست داری کدوم بخش رو ادامه بدیم؟');
    mode = 'done';
  }
}

function submitAnswer(event) {
  event.preventDefault();
  commitAnswer(composer.querySelector('#answer').value);
}

function commitAnswer(answer) {
  let value = answer.trim();
  if (!value) return;
  if (field.key === 'identity') {
    value = value.replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
      .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
    if (!/^\d{10}$/.test(value)) {
      composer.querySelector('.error').textContent = 'کد ملی باید ۱۰ رقم باشه.';
      return;
    }
  }
  const answered = field;
  answers[answered.key] = value;
  const feedback = application?.feedback?.find(item => item.kind === answered.key);
  if (feedback && application.phase === 'correction') feedback.edited = value !== feedback.original;
  delete personalDrafts[answered.key];
  const visibleValue = answered.key === 'identity' ? '••••••' + value.slice(-4) : value;
  driver(visibleValue, { edit: () => { askField(answered, true); render(); } });
  bot(editing ? 'اصلاح شد.' : 'ثبت شد.');
  if (editing) mode = 'fields';
  else nextField();
  render();
}

composer.addEventListener('input', event => {
  const input = event.target;
  if (mode === 'field' && input.id === 'answer') {
    personalDrafts[field.key] = input.value;
  } else if (mode === 'review' && task === 'license' && input.dataset.reviewField) {
    licenseDraft[input.dataset.reviewField] = input.value;
  } else return;
  saveDraft();
});

function imageKeys(key = task) {
  if (key === 'live') return ['face'];
  return documents[key].type === 'card' ? ['front', 'back'] : ['single'];
}

function nextImage(key = task) {
  if (replacement?.key === key) return replacement.side;
  return imageKeys(key).find(side => !documents[key].images[side]);
}

function imageLabel(key = task, side = nextImage(key)) {
  if (key === 'live') return 'عکس زنده چهره';
  const label = documentTypes[key][documents[key].type];
  if (side === 'front') return 'روی ' + label;
  if (side === 'back') return 'پشت ' + label;
  return 'تصویر ' + label;
}

function releaseCamera() {
  cameraSession += 1;
  cameraStream?.getTracks().forEach(track => track.stop());
  cameraStream = null;
  cameraVideo.srcObject = null;
  cameraCapture.disabled = true;
}

function closeCamera() {
  releaseCamera();
  cameraSheet.close();
}

async function openCamera() {
  if (cameraSheet.open) return;
  const session = ++cameraSession;
  const isFace = task === 'live';
  let shape = 'paper';
  if (isFace) shape = 'face';
  else if (documents[task].type === 'card') shape = 'card';

  cameraView.dataset.shape = shape;
  cameraSheet.querySelector('#camera-title').textContent = imageLabel();
  cameraSheet.querySelector('#camera-hint').textContent = isFace
    ? 'صورتت رو وسط قاب بگذار و به دوربین نگاه کن.'
    : 'همه گوشه‌های مدرک رو داخل قاب بگذار و مطمئن شو نوشته‌ها واضحن.';
  cameraStatus.textContent = 'در حال باز کردن دوربین…';
  cameraStatus.hidden = false;
  cameraCapture.disabled = true;
  cameraFallback.hidden = true;
  cameraSheet.showModal();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: isFace ? 'user' : 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    if (session !== cameraSession) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    cameraStream = stream;
    cameraVideo.srcObject = stream;
    await cameraVideo.play();
    if (session !== cameraSession) return;
    cameraStatus.hidden = true;
    cameraCapture.disabled = false;
  } catch {
    if (session !== cameraSession) return;
    releaseCamera();
    cameraStatus.textContent = 'دوربین در این صفحه باز نشد.';
    cameraFallback.hidden = false;
  }
}

function captureCameraPhoto() {
  if (!cameraStream || cameraCapture.disabled) return;
  const session = cameraSession;
  cameraCapture.disabled = true;
  const retry = () => {
    cameraStatus.textContent = 'عکس ثبت نشد. دوباره امتحان کن.';
    cameraStatus.hidden = false;
    cameraCapture.disabled = false;
  };
  try {
    const canvas = document.createElement('canvas');
    canvas.width = cameraVideo.videoWidth;
    canvas.height = cameraVideo.videoHeight;
    canvas.getContext('2d').drawImage(cameraVideo, 0, 0);
    canvas.toBlob(blob => {
      if (session !== cameraSession) return;
      if (!blob) {
        retry();
        return;
      }
      closeCamera();
      previewPhoto({ blob });
    }, 'image/jpeg', .92);
  } catch {
    retry();
  }
}

cameraSheet.querySelector('[data-camera-close]').addEventListener('click', closeCamera);
cameraSheet.addEventListener('cancel', event => {
  event.preventDefault();
  closeCamera();
});
cameraCapture.addEventListener('click', captureCameraPhoto);
cameraFallback.addEventListener('click', () => {
  closeCamera();
  composer.querySelector('#camera').click();
});
window.addEventListener('pagehide', () => { if (cameraSheet.open) closeCamera(); });

function askPhoto() {
  mode = 'upload';
  if (task === 'live') {
    bot('یه عکس تازه از چهره‌ات بگیر. صورتت کامل توی کادر باشه و نور کافی داشته باشه.');
  } else {
    bot('لطفاً عکس «' + imageLabel() + '» رو بفرست. نوشته‌ها و گوشه‌های مدرک واضح باشن.');
  }
}

function previewPhoto(photo) {
  pendingPhoto = photo.url ? photo : photoPreview(photo);
  driver(imageLabel(), { photo: pendingPhoto });
  bot('این تصویر رو استفاده کنیم؟');
  mode = 'photo';
  render();
}

function acceptPhoto() {
  documents[task].images[nextImage()] = pendingPhoto;
  pendingPhoto = null;
  if (replacement) {
    if (application?.phase === 'correction' && replacement.key === 'license' && replacement.side === application.flagSide) {
      const feedback = application.feedback.find(item => item.kind === 'photo');
      if (feedback) feedback.edited = true;
    }
    replacement = null;
    mode = 'done';
    driver('تصویر جایگزین رو تأیید می‌کنم.');
    bot('تصویر جدید ذخیره شد. از مرور اطلاعات می‌تونی درخواستت رو بفرستی.');
    return;
  }
  driver('بله، همین تصویر.');
  if (nextImage()) {
    askPhoto();
  } else if (task === 'live') {
    bot('عکس چهره دریافت شد.');
    mode = 'done';
  } else {
    bot('تصویرها دریافت شد. اطلاعات نمونه رو بررسی کن و اگه لازم بود تغییر بده.');
    mode = 'review';
    if (task === 'car') openCarReviewAfterReply = true;
  }
}

function persianDateParts(date) {
  const parts = Object.fromEntries(persianCalendar.formatToParts(date).map(part => [part.type, Number(part.value)]));
  return { year: parts.year, month: parts.month, day: parts.day };
}

function lastBirthMonth(year) {
  return year === birthToday.year ? birthToday.month : 12;
}

function lastBirthDay(year, month) {
  if (year === birthToday.year && month === birthToday.month) return birthToday.day;
  if (month <= 6) return 31;
  if (month < 12) return 30;

  // Find Esfand 30 around the Gregorian March boundary using the same Persian calendar as the picker.
  for (let day = 18; day <= 23; day++) {
    const parts = persianDateParts(new Date(Date.UTC(year + 622, 2, day, 12)));
    if (parts.year === year && parts.month === 12 && parts.day === 30) return 30;
  }
  return 29;
}

function parseBirthdate(value) {
  const digits = value.replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
    .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
  if (!/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(digits)) return null;
  const [year, month, day] = digits.split('/').map(Number);
  if (year < birthYearMin || year > birthToday.year || month < 1 || month > lastBirthMonth(year)) return null;
  if (day < 1 || day > lastBirthDay(year, month)) return null;
  return { year, month, day };
}

function dateDigits(value, minLength = 1) {
  return String(value).padStart(minLength, '0').replace(/\d/g, digit => '۰۱۲۳۴۵۶۷۸۹'[digit]);
}

function birthWheelLimits(part) {
  if (part === 'year') return [birthYearMin, birthToday.year];
  if (part === 'month') return [1, lastBirthMonth(birthDraft.year)];
  return [1, lastBirthDay(birthDraft.year, birthDraft.month)];
}

function birthWheelLabel(part, value) {
  return part === 'month' ? persianMonths[value - 1] : dateDigits(value);
}

function renderBirthWheel(wheel, align) {
  const part = wheel.dataset.part;
  const [min, max] = birthWheelLimits(part);
  const descending = part === 'year';
  const range = min + '-' + max;
  if (wheel.dataset.range !== range) {
    wheel.dataset.range = range;
    wheel.innerHTML = Array.from({ length: max - min + 1 }, (_, index) => {
      const value = descending ? max - index : min + index;
      return '<div class="birth-option" data-value="' + value + '" aria-hidden="true">' + birthWheelLabel(part, value) + '</div>';
    }).join('');
    align = true;
  }
  const value = birthDraft[part];
  const index = descending ? max - value : value - min;
  wheel.querySelector('[data-selected]')?.removeAttribute('data-selected');
  wheel.children[index].setAttribute('data-selected', '');
  wheel.setAttribute('aria-valuemin', min);
  wheel.setAttribute('aria-valuemax', max);
  wheel.setAttribute('aria-valuenow', value);
  wheel.setAttribute('aria-valuetext', birthWheelLabel(part, value));
  if (align) wheel.scrollTop = index * wheel.firstElementChild.offsetHeight;
}

function selectBirthPart(wheel, value, align = true) {
  const part = wheel.dataset.part;
  if (!align && birthDraft[part] === value) return;
  const [min, max] = birthWheelLimits(part);
  const previousMonth = birthDraft.month;
  const previousDay = birthDraft.day;
  birthDraft[part] = Math.max(min, Math.min(max, value));
  birthDraft.month = Math.min(birthDraft.month, lastBirthMonth(birthDraft.year));
  birthDraft.day = Math.min(birthDraft.day, lastBirthDay(birthDraft.year, birthDraft.month));
  for (const item of birthWheels) {
    const other = item.dataset.part;
    if (item === wheel) renderBirthWheel(item, align);
    else if (other === 'month' && part === 'year') renderBirthWheel(item, previousMonth !== birthDraft.month);
    else if (other === 'day' && part !== 'day') renderBirthWheel(item, previousDay !== birthDraft.day);
  }
}

function openBirthPicker() {
  birthToday = persianDateParts(new Date());
  const value = composer.querySelector('#birthdate-value').value;
  birthDraft = parseBirthdate(value) || { year: Math.max(birthYearMin, birthToday.year - 30), month: 1, day: 1 };
  birthPicker.showModal();
  birthWheels.forEach(wheel => renderBirthWheel(wheel, true));
}

birthWheels.forEach(wheel => {
  wheel.addEventListener('scroll', () => {
    const rowHeight = wheel.firstElementChild?.offsetHeight;
    if (!birthPicker.open || !rowHeight) return;
    const index = Math.round(wheel.scrollTop / rowHeight);
    const option = wheel.children[index];
    if (option) selectBirthPart(wheel, Number(option.dataset.value), false);
  });
  wheel.addEventListener('click', event => {
    const option = event.target.closest('[data-value]');
    if (option) selectBirthPart(wheel, Number(option.dataset.value));
  });
  wheel.addEventListener('keydown', event => {
    const value = birthDraft[wheel.dataset.part];
    const [min, max] = birthWheelLimits(wheel.dataset.part);
    const choices = { ArrowUp: value + 1, ArrowDown: value - 1, PageUp: value + 10, PageDown: value - 10, Home: min, End: max };
    if (!Object.hasOwn(choices, event.key)) return;
    event.preventDefault();
    selectBirthPart(wheel, choices[event.key]);
  });
});

birthPicker.querySelector('[data-birthdate-confirm]').addEventListener('click', () => {
  const { year, month, day } = birthDraft;
  const value = [dateDigits(year), dateDigits(month, 2), dateDigits(day, 2)].join('/');
  composer.querySelector('#birthdate-value').value = value;
  composer.querySelector('[data-birthdate-display]').textContent = value;
  licenseDraft[birthdateLabel] = value;
  saveDraft();
  birthPicker.close();
});

const plateLetters = ['الف', 'ب', 'ج', 'د', 'س', 'ص', 'ط', 'ع', 'ق', 'ل', 'م', 'ن', 'و', 'ه', 'ی'];
const carTypes = ['پژو ۲۰۷', 'پژو ۲۰۶', 'پژو پارس', 'سمند LX', 'دنا پلاس', 'تارا', 'تیبا', 'ساینا', 'کوییک', 'پراید ۱۳۱', 'رانا پلاس'];
const carColors = ['سفید', 'مشکی', 'خاکستری', 'نقره‌ای', 'نوک‌مدادی', 'قرمز', 'آبی', 'سرمه‌ای', 'سبز', 'بژ', 'سایر'];

function latinDigits(value) {
  return value.replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
    .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
}

function carOptions(choices, current, placeholder) {
  const values = current && !choices.includes(current) ? [current, ...choices] : choices;
  return '<option value="">' + escape(placeholder) + '</option>' + values.map(value =>
    '<option value="' + escape(value) + '"' + (value === current ? ' selected' : '') + '>' + escape(value) + '</option>'
  ).join('');
}

function carSelect(label, name, choices, current) {
  return '<label class="car-field">' + label + '<select name="' + name + '" required>' +
    carOptions(choices, current, label) + '</select></label>';
}

function plateDigits(name, label, length, value = '') {
  return '<input type="text" name="' + name + '" aria-label="' + label + '" inputmode="numeric" maxlength="' + length +
    '" pattern="[0-9۰-۹٠-٩]{' + length + '}" autocomplete="off" required value="' + (value ? dateDigits(value) : '') + '">';
}

function buildCarReview(details) {
  const rawPlate = (details['پلاک'] || '').trim();
  const plate = latinDigits(rawPlate).match(/^(\d{2})\s*([^\d\s]+)\s*(\d{3})\s*(?:ایران\s*)?(\d{2})$/);
  const [, first, letter, serial, region] = plate || [];
  const isNational = Boolean(plate) || !rawPlate;
  const currentYear = persianDateParts(new Date()).year;
  const years = Array.from({ length: currentYear - 1349 }, (_, index) => dateDigits(currentYear - index));
  carReviewFields.innerHTML = '<div class="car-review-fields">' +
    '<section aria-label="شماره پلاک"><div class="car-plate-heading"><label for="car-plate-type">شماره پلاک</label>' +
    '<select id="car-plate-type" name="plate-type" aria-label="نوع پلاک"><option value="national">پلاک ملی</option>' +
    '<option value="other"' + (isNational ? '' : ' selected') + '>سایر</option></select></div>' +
    '<fieldset class="car-plate-set" data-plate-national><div class="car-plate" dir="ltr">' +
    '<div class="car-plate-badge" aria-hidden="true"><span class="car-plate-flag"></span><span>IR<br>IRAN</span></div>' +
    plateDigits('plate-first', 'دو رقم اول پلاک', 2, first) +
    '<select name="plate-letter" aria-label="حرف پلاک" dir="rtl" required>' + carOptions(plateLetters, letter, 'حرف') + '</select>' +
    plateDigits('plate-serial', 'سه رقم میانی پلاک', 3, serial) +
    '<div class="car-plate-region">' + plateDigits('plate-region', 'کد ایران پلاک', 2, region) + '<span aria-hidden="true">ایران</span></div>' +
    '</div></fieldset><fieldset class="car-plate-set" data-plate-other><input name="plate-other" aria-label="شماره پلاک" required value="' +
    escape(isNational ? '' : rawPlate) + '"></fieldset></section>' +
    carSelect('سیستم و تیپ خودرو', 'vehicle', carTypes, details['نوع خودرو']) +
    carSelect('مدل (سال تولید خودرو)', 'year', years, details['مدل']) +
    carSelect('رنگ خودرو', 'color', carColors, details['رنگ']) +
    '<label class="car-field">شماره VIN<input class="car-vin" name="vin" required autocapitalize="characters" spellcheck="false" value="' +
    escape(details['شماره شاسی'] || '') + '"></label>' +
    '<section class="car-owner"><h3>اطلاعات مالک</h3><label class="car-field">نام مالک<input name="owner" required value="' +
    escape(details['نام مالک'] || '') + '"></label><label class="car-field">کد ملی مالک<input name="owner-id" inputmode="numeric" required value="' +
    escape(details['کد ملی مالک'] || '') + '"></label></section></div>';
  for (const [name, value] of Object.entries(carDraft)) {
    const input = carReviewForm.elements.namedItem(name);
    if (input) input.value = value;
  }
  syncPlateType();
}

function syncPlateType() {
  const isNational = carReviewForm.elements.namedItem('plate-type').value === 'national';
  for (const [selector, visible] of [['[data-plate-national]', isNational], ['[data-plate-other]', !isNational]]) {
    const group = carReviewFields.querySelector(selector);
    group.hidden = !visible;
    group.disabled = !visible;
  }
}

function openCarReview() {
  const details = documents.car.details || sampleDetails.car;
  if (carReviewSource !== details) {
    buildCarReview(details);
    carReviewSource = details;
  }
  carReview.querySelector('[data-car-error]').textContent = '';
  carReview.showModal();
  carReviewFields.scrollTop = 0;
}

function saveCarField(event) {
  const { name, value } = event.target;
  if (!name || carDraft[name] === value) return;
  carDraft[name] = value;
  saveDraft();
}

carReviewForm.addEventListener('input', saveCarField);
carReviewForm.addEventListener('change', event => {
  if (event.target.name === 'plate-type') syncPlateType();
  saveCarField(event);
});

carReviewForm.addEventListener('submit', event => {
  event.preventDefault();
  const data = new FormData(carReviewForm);
  const value = key => String(data.get(key) || '').trim();
  const plate = value('plate-type') === 'national'
    ? [dateDigits(latinDigits(value('plate-first'))), value('plate-letter'), dateDigits(latinDigits(value('plate-serial'))),
      'ایران', dateDigits(latinDigits(value('plate-region')))].join(' ')
    : value('plate-other');
  const details = {
    'پلاک': plate, 'نوع خودرو': value('vehicle'), 'مدل': value('year'), 'رنگ': value('color'),
    'شماره شاسی': latinDigits(value('vin')).toUpperCase(), 'نام مالک': value('owner'), 'کد ملی مالک': value('owner-id'),
  };
  if (Object.values(details).some(item => !item)) {
    carReview.querySelector('[data-car-error]').textContent = 'لطفاً همه موارد رو کامل کن.';
    return;
  }
  carReview.close();
  finishReview('car', details);
});

function finishReview(key, details) {
  documents[key].details = details;
  const draft = key === 'car' ? carDraft : licenseDraft;
  for (const name of Object.keys(draft)) delete draft[name];
  driver('اطلاعات مدرک رو تأیید می‌کنم.');
  bot(titles(key) + ' ثبت شد. کدوم بخش رو ادامه بدیم؟');
  mode = 'done';
  render();
}

function renderReview() {
  if (task === 'car') {
    composer.innerHTML = options('بررسی اطلاعات مدرک', option('بررسی اطلاعات خودرو', 'car-review')) + controls();
    return;
  }
  const details = { ...(documents.license.details || sampleDetails.license), ...licenseDraft };
  const inputs = Object.entries(details).map(([label, value]) => {
    if (label === birthdateLabel) {
      return '<div><label for="birthdate-trigger">' + birthdateLabel + '</label>' +
        '<button class="option birthdate-trigger" id="birthdate-trigger" type="button" aria-haspopup="dialog" aria-controls="birthdate-picker">' +
        '<span data-birthdate-display>' + escape(value || 'انتخاب تاریخ تولد') + '</span><span aria-hidden="true">⌄</span></button>' +
        '<input type="hidden" id="birthdate-value" value="' + escape(value) + '"></div>';
    }
    return '<label>' + escape(label) + '<input data-review-field="' + escape(label) + '" required value="' + escape(value) + '"></label>';
  });
  composer.innerHTML = '<div class="composer-title">بررسی اطلاعات مدرک</div><form><div class="review-grid">' +
    inputs.join('') + '</div><button class="send review-action" type="submit">تأیید اطلاعات</button></form>' + controls();
  const birthTrigger = composer.querySelector('#birthdate-trigger');
  if (birthTrigger) birthTrigger.onclick = openBirthPicker;
  composer.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const values = [...event.currentTarget.querySelectorAll('input')].map(input => input.value.trim());
    if (values.some(value => !value)) return;
    finishReview(task, Object.fromEntries(Object.keys(details).map((label, index) => [label, values[index]])));
  };
}

function titles(key) {
  return tasks[key][0];
}

function chooseTask(key) {
  if (key !== task || replacement) pendingPhoto = null;
  replacement = null;
  task = key;
  showRestoredPhotos(key);
  driver(tasks[key][1]);
  if (task === 'personal') {
    if (isComplete(task)) mode = 'fields';
    else nextField();
  } else if (task === 'live') {
    if (isComplete(task)) {
      bot('عکس چهره‌ات در این گفت‌وگو ثبت شده.');
      mode = 'done';
    } else askPhoto();
  } else if (!documents[task].type) {
    bot(task === 'license' ? 'کارت گواهینامه داری یا رسیدش رو؟' : 'کارت خودرو رو داری یا برگ سبز؟');
    mode = 'doctype';
  } else if (nextImage()) {
    askPhoto();
  } else {
    bot('تصویرهای قبلی اینجا هستن. اطلاعات مدرک رو بررسی کن.');
    mode = 'review';
    if (task === 'car') openCarReviewAfterReply = true;
  }
}

function handleAction(action) {
  let [command, key] = action.split(':');
  if (showingProgress) {
    const isCurrentField = command === 'field' && mode === 'field' && key === field.key;
    const isCurrentTask = command === 'task' && key === task && ['doctype', 'upload', 'photo', 'review'].includes(mode);
    if (isCurrentField || isCurrentTask) command = 'return-from-progress';
  }
  showingProgress = false;
  switch (command) {
    case 'return-from-progress':
      if (mode === 'field') bot(editing ? field.label + ' رو دوباره بفرست.' : field.question);
      else bot('برگردیم به مرحله قبلی ثبت‌نام.');
      break;
    case 'continue-draft': continueDraft(); break;
    case 'reset-draft': resetDraft(); return;
    case 'final-review': openFinalReview(); return;
    case 'cancel-replacement':
      replacement = null;
      pendingPhoto = null;
      mode = 'done';
      render();
      openFinalReview();
      return;
    case 'view-status': openApplicationStatus(); return;
    case 'task': chooseTask(key); break;
    case 'field': askField(fields.find(item => item.key === key), Boolean(answers[key])); break;
    case 'type':
      documents[task].type = key;
      driver(documentTypes[task][key] + ' دارم.');
      askPhoto();
      break;
    case 'tasks':
      previousMode = mode;
      mode = 'tasks';
      break;
    case 'resume': mode = previousMode; break;
    case 'fields': mode = 'fields'; break;
    case 'car-review': openCarReview(); return;
    case 'skip': {
      driver('این مورد بمونه برای بعد.');
      const index = fields.indexOf(field);
      const remaining = [...fields.slice(index + 1), ...fields.slice(0, index)];
      const next = remaining.find(item => !answers[item.key]);
      if (next) askField(next);
      else {
        bot('باشه، هر وقت آماده بودی برمی‌گردیم سراغش.');
        mode = 'tasks';
      }
      break;
    }
    case 'camera':
      openCamera();
      return;
    case 'gallery':
      composer.querySelector('#' + command).click();
      return;
    case 'sample':
      previewPhoto({ sample: true });
      return;
    case 'retake':
      pendingPhoto = null;
      driver('دوباره انتخاب می‌کنم.');
      askPhoto();
      break;
    case 'keep': acceptPhoto(); break;
  }
  render();
}

async function startRegistration() {
  progressTrigger.disabled = true;
  composer.textContent = 'در حال بررسی پیش‌نویس…';
  let restored = false;
  try {
    draftDatabase = await openDraftDatabase();
    restored = restoreDraft(await readDraft());
  } catch {
    draftDatabase = null;
    showDraftStatus('ذخیره روی دستگاه در دسترس نیست');
  }
  progressTrigger.disabled = false;
  if (restored) {
    showDraftStatus('پیش‌نویس روی دستگاه ذخیره شد');
    refreshApplicationStatus();
    bot(application && !applicationEditing ? 'خوش برگشتی! می‌تونی وضعیت درخواستت رو ببینی.' :
      'خوش برگشتی! می‌تونی ثبت‌نام قبلی رو ادامه بدی.');
  } else {
    bot('سلام! به ثبت‌نام رانندگان تپسی خوش اومدی. با هم اطلاعات و مدارکت رو ثبت می‌کنیم.');
    bot('این نسخه آزمایشیه. می‌تونی با اطلاعات و تصویر نمونه امتحانش کنی. دوست داری از کدوم بخش شروع کنیم؟');
  }
  render(false);
}

startRegistration();
})();
</script>
</body>
</html>
