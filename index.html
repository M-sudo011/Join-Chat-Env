<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>همراه ثبت‌نام تپسی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500&display=swap');
#join-chat{padding:18px 8px;color-scheme:light dark;font-family:Vazirmatn,Tahoma,sans-serif}
#join-chat *{box-sizing:border-box}
#join-chat .device{max-width:400px;margin:auto;overflow:hidden;border:1px solid light-dark(#ddd,#484848);border-radius:22px;background:light-dark(#fff,#191b1c);color:light-dark(#252726,#f0f0ed)}
#join-chat .app-header{display:flex;gap:12px;align-items:center;padding:19px 18px;border-bottom:1px solid light-dark(#ededeb,#363a3b);background:light-dark(#fff,#202324)}
#join-chat .mark{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:light-dark(#fff0e9,#4a3024);color:light-dark(#b2380b,#ffb294);font-size:18px;font-weight:500}
#join-chat .heading{font-size:14px;font-weight:500}
#join-chat .sub{font-size:11px;color:light-dark(#686d69,#b3b9b5);margin-top:3px}
#join-chat .history{display:flex;flex-direction:column;gap:15px;padding:23px 15px 24px;min-height:300px;justify-content:flex-end}
#join-chat .message{max-width:88%;padding:12px 14px;font-size:13px;line-height:1.95;overflow-wrap:anywhere;white-space:pre-wrap}
#join-chat .assistant{align-self:flex-end;background:light-dark(#f0f1ef,#303534);border-radius:15px 15px 15px 4px}
#join-chat .driver{align-self:flex-start;background:light-dark(#dff3e3,#284a35);border-radius:15px 15px 4px 15px}
#join-chat .bubble-photo{display:block;width:100%;max-height:160px;object-fit:contain;border-radius:8px;margin-top:8px}
#join-chat .editor{display:block;text-align:left;margin-top:5px}
#join-chat button{font:inherit;color:inherit}
#join-chat .link{border:0;padding:6px 2px;background:transparent;font-size:11px;text-decoration:underline;text-underline-offset:3px;min-height:30px}
#join-chat .older{align-self:center;border:0;background:transparent;font-size:11px;color:light-dark(#606762,#c0c6c1);padding:8px}
#join-chat .composer{background:light-dark(#f5f6f4,#232827);padding:16px;border-top:1px solid light-dark(#e6e9e5,#3f4542)}
#join-chat .composer-title{font-size:12px;margin-bottom:12px;color:light-dark(#515a53,#c4cec6)}
#join-chat .options{display:grid;gap:9px}
#join-chat .option{width:100%;display:flex;justify-content:space-between;align-items:center;gap:9px;text-align:right;background:light-dark(#fff,#303632);border:1px solid light-dark(#dce1db,#4b564c);padding:12px 14px;border-radius:10px;font-size:13px;min-height:46px}
#join-chat .option-status{font-size:11px;color:light-dark(#637066,#b6c9ba);flex-shrink:0}
#join-chat .entry{display:flex;align-items:stretch;gap:8px}
#join-chat input,#join-chat select,#join-chat textarea{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px;border:1px solid light-dark(#d4dbd2,#5c685d);background:light-dark(#fff,#303632);color:inherit;border-radius:10px;min-height:46px}
#join-chat .entry select,#join-chat .entry input,#join-chat .entry textarea{flex:1}
#join-chat .send{border:0;border-radius:10px;background:light-dark(#242a25,#e0eae1);color:light-dark(#fff,#1b251d);padding:10px 15px;font-size:12px;min-height:46px;flex-shrink:0}
#join-chat .tools{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
#join-chat .tool{background:transparent;border:0;font-size:11px;min-height:38px;padding:5px 0;color:light-dark(#556258,#bdcbbf)}
#join-chat .error{font-size:12px;color:light-dark(#a02a1d,#ffb6a9);margin-top:8px}
#join-chat label{display:block;font-size:12px;margin-bottom:9px}
#join-chat .upload{display:flex;gap:8px}
#join-chat .upload button{flex:1}
#join-chat input[type=file]{display:none}
#join-chat button:disabled{opacity:.55}

:root { color-scheme: light dark; }
body { margin: 0; background: light-dark(#f2f4f1, #121513); }
#join-chat { padding: 0; }
#join-chat .device { display: flex; flex-direction: column; max-width: 460px; height: 100vh; height: 100dvh; }
#join-chat .app-header { flex: none; }
#join-chat .history { flex: 1; min-height: 0; overflow: auto; justify-content: flex-start; }
#join-chat .message { flex: none; font-size: 14px; }
#join-chat .composer { flex: none; max-height: 56dvh; overflow: auto; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
#join-chat .option, #join-chat .send { font-size: 14px; }
#join-chat .tool, #join-chat .link { min-height: 44px; font-size: 12px; }
#join-chat .tools { gap: 8px 14px; justify-content: flex-start; }
#join-chat .review-grid { display: grid; gap: 10px; margin-bottom: 12px; }
#join-chat .review-grid label { margin-bottom: 0; }
#join-chat .review-grid input { margin-top: 4px; }
#join-chat .review-action { width: 100%; }
#join-chat .sample { border: 1px dashed currentColor; border-radius: 8px; padding: 6px 10px; margin-top: 6px; font-size: 12px; }
#join-chat .upload { flex-wrap: wrap; }
#join-chat .upload .option { width: auto; }
@media (min-width: 520px) and (min-height: 690px) {
  #join-chat { padding: 22px 12px; }
  #join-chat .device { height: min(820px, calc(100dvh - 44px)); box-shadow: 0 16px 50px #0002; }
}
@media (max-width: 519px) {
  #join-chat .device { max-width: none; border: 0; border-radius: 0; }
}
</style>
</head>
<body>
<main id="join-chat">
  <section class="device" aria-label="گفت‌وگوی ثبت‌نام راننده">
    <header class="app-header">
      <span class="mark" aria-hidden="true">ت</span>
      <div><div class="heading">همراه ثبت‌نام تپسی</div><div class="sub" data-progress></div></div>
    </header>
    <div class="history" role="log" aria-label="پیام‌های گفت‌وگو"></div>
    <div class="composer" aria-label="پاسخ به پیام"></div>
  </section>
</main>
<script>
const app = document.querySelector('#join-chat');
const history = app.querySelector('.history');
const composer = app.querySelector('.composer');
const progress = app.querySelector('[data-progress]');
const tasks = {
  personal: ['اطلاعات شخصی', 'می‌خوام اطلاعات شخصی‌مو ثبت کنم.'],
  license: ['گواهینامه', 'می‌خوام گواهینامه‌مو ثبت کنم.'],
  car: ['اطلاعات خودرو', 'بریم سراغ اطلاعات خودرو.'],
  live: ['عکس زنده', 'می‌خوام عکس چهره‌مو بگیرم.'],
};
const fields = [
  { key: 'city', label: 'شهر فعالیت', question: 'دوست داری توی کدوم شهر فعالیت کنی؟' },
  { key: 'identity', label: 'کد ملی', question: 'کد ملی‌ات رو می‌فرستی؟' },
  { key: 'father', label: 'نام پدر', question: 'اسم پدرت رو می‌نویسی؟' },
  { key: 'address', label: 'نشانی', question: 'نشانی محل سکونتت رو می‌نویسی؟' },
];
const cities = ['تهران', 'کرج', 'مشهد', 'اصفهان', 'شیراز', 'تبریز', 'رشت', 'اهواز'];
const documentTypes = {
  license: { card: 'کارت گواهینامه', receipt: 'رسید گواهینامه' },
  car: { card: 'کارت خودرو', green: 'برگ سبز' },
};
const sampleDetails = {
  license: { 'نام و نام خانوادگی': 'علی نمونه', 'تاریخ تولد': '۱۳۶۹/۰۱/۰۱' },
  car: {
    'پلاک': '۱۲ ب ۳۴۵ ایران ۶۷', 'نوع خودرو': 'پژو ۲۰۶', 'مدل': '۱۳۹۸',
    'رنگ': 'سفید', 'شماره شاسی': 'SAMPLE-VIN', 'نام مالک': 'علی نمونه', 'کد ملی مالک': '۰۰۰۰۰۰۰۰۰۰',
  },
};
const answers = {};
const documents = { license: { images: {} }, car: { images: {} }, live: { images: {} } };
let task = null;
let field = null;
let mode = 'tasks';
let previousMode = 'tasks';
let editing = false;
let pendingPhoto = null;
let submitted = false;

const escape = value => String(value).replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
})[char]);

function addMessage(who, text, options = {}) {
  const bubble = document.createElement('div');
  bubble.className = 'message ' + who;
  bubble.setAttribute('aria-label', (who === 'driver' ? 'راننده، ' : 'تپسی، ') + text);
  bubble.textContent = text;
  if (options.photo?.url) {
    const image = document.createElement('img');
    image.className = 'bubble-photo';
    image.src = options.photo.url;
    image.alt = 'تصویر انتخاب‌شده';
    bubble.append(image);
  }
  if (options.photo?.sample) {
    const sample = document.createElement('div');
    sample.className = 'sample';
    sample.textContent = 'تصویر نمونه';
    bubble.append(sample);
  }
  if (options.edit) {
    const edit = document.createElement('button');
    edit.className = 'editor link';
    edit.type = 'button';
    edit.textContent = 'ویرایش';
    edit.addEventListener('click', options.edit);
    bubble.append(edit);
  }
  history.append(bubble);
  history.scrollTop = history.scrollHeight;
}

const bot = (text, options) => addMessage('assistant', text, options);
const driver = (text, options) => addMessage('driver', text, options);
const persian = value => Number(value).toLocaleString('fa-IR');

function isComplete(key) {
  if (key === 'personal') return fields.every(item => answers[item.key]);
  if (key === 'live') return Boolean(documents.live.images.face);
  return Boolean(documents[key].details);
}

function taskStatus(key) {
  if (isComplete(key)) return 'تکمیل شده ✓';
  if (key === 'personal') return persian(Object.keys(answers).length) + ' از ۴';
  return Object.keys(documents[key].images).length ? 'در حال تکمیل' : '';
}

function option(label, action, status = '') {
  return '<button class="option" type="button" data-action="' + action + '"><span>' +
    escape(label) + '</span><span class="option-status">' + escape(status) + '</span></button>';
}

function smallAction(label, action) {
  return '<button class="tool" type="button" data-action="' + action + '">' + escape(label) + '</button>';
}

function controls(personal = false) {
  const extras = personal
    ? smallAction('این سؤال بمونه برای بعد', 'skip') + smallAction('انتخاب سؤال', 'fields')
    : '';
  return '<div class="tools">' + extras + smallAction('تغییر بخش', 'tasks') + '</div>';
}

function options(title, buttons) {
  return '<div class="composer-title">' + escape(title) + '</div><div class="options">' + buttons + '</div>';
}

function inputForField() {
  const value = answers[field.key] || '';
  if (field.key === 'city') {
    const cityOptions = cities.map(city => '<option' + (city === value ? ' selected' : '') + '>' + city + '</option>');
    return '<select id="answer" required><option value="">انتخاب شهر</option>' + cityOptions.join('') + '</select>';
  }
  if (field.key === 'address') return '<textarea id="answer" rows="2" required>' + escape(value) + '</textarea>';
  const numeric = field.key === 'identity' ? ' inputmode="numeric" maxlength="10"' : '';
  return '<input id="answer" required' + numeric + ' value="' + escape(value) + '" autocomplete="off">';
}

function render() {
  const complete = Object.keys(tasks).filter(isComplete).length;
  progress.textContent = 'نسخه آزمایشی · ' + persian(complete) + ' از ۴ بخش تکمیل شده';
  if (mode === 'tasks') {
    const taskButtons = Object.entries(tasks).map(([key, [label]]) => option(label, 'task:' + key, taskStatus(key)));
    if (complete === 4 && !submitted) taskButtons.push(option('ارسال آزمایشی برای بررسی', 'submit'));
    composer.innerHTML = options('از کدوم بخش ادامه بدیم؟', taskButtons.join(''));
    if (task && previousMode !== 'tasks') {
      composer.insertAdjacentHTML('beforeend', '<div class="tools">' + smallAction('برگشت به گفت‌وگو', 'resume') + '</div>');
    }
  } else if (mode === 'field') {
    composer.innerHTML = '<form><label for="answer">' + field.label + '</label><div class="entry">' +
      inputForField() + '<button class="send" type="submit">ارسال</button></div><div class="error" role="alert"></div></form>' +
      controls(true);
    composer.querySelector('form').onsubmit = submitAnswer;
  } else if (mode === 'fields') {
    const buttons = fields.map(item => option(item.label, 'field:' + item.key, answers[item.key] ? 'ثبت شده ✓' : ''));
    composer.innerHTML = options('کدوم مورد رو ثبت یا ویرایش کنیم؟', buttons.join('')) + controls();
  } else if (mode === 'doctype') {
    const buttons = Object.entries(documentTypes[task]).map(([key, label]) => option(label + ' دارم', 'type:' + key));
    composer.innerHTML = options('نوع مدرک', buttons.join('')) + controls();
  } else if (mode === 'upload') {
    const gallery = task === 'live' ? '' : '<button class="option" type="button" data-action="gallery">گالری</button>';
    composer.innerHTML = '<div class="composer-title">' + imageLabel() + '</div><div class="upload">' +
      '<button class="send" type="button" data-action="camera">گرفتن عکس</button>' + gallery +
      '<button class="option" type="button" data-action="sample">تصویر نمونه</button></div>' +
      '<input type="file" accept="image/*" id="camera" capture="' + (task === 'live' ? 'user' : 'environment') + '">' +
      '<input type="file" accept="image/*" id="gallery">' + controls();
    composer.querySelectorAll('input[type=file]').forEach(input => {
      input.onchange = () => {
        if (input.files.length) previewPhoto({ url: URL.createObjectURL(input.files[0]) });
      };
    });
  } else if (mode === 'photo') {
    composer.innerHTML = options('تصویر رو تأیید می‌کنی؟',
      option('بله، همین تصویر', 'keep') + option('دوباره انتخاب می‌کنم', 'retake')) + controls();
  } else if (mode === 'review') {
    renderReview();
  } else {
    composer.innerHTML = options('ادامه ثبت‌نام', option('بخش بعدی رو انتخاب می‌کنم', 'tasks'));
  }
  composer.querySelectorAll('[data-action]').forEach(button => {
    button.onclick = () => handleAction(button.dataset.action);
  });
  history.scrollTop = history.scrollHeight;
}

function askField(item, edit = false) {
  task = 'personal';
  field = item;
  editing = edit;
  mode = 'field';
  bot(edit ? item.label + ' رو دوباره بفرست.' : item.question);
}

function nextField() {
  const next = fields.find(item => !answers[item.key]);
  if (next) {
    askField(next);
  } else {
    bot('اطلاعات شخصی‌ات تکمیل شد. دوست داری کدوم بخش رو ادامه بدیم؟');
    mode = 'done';
  }
}

function submitAnswer(event) {
  event.preventDefault();
  let value = composer.querySelector('#answer').value.trim();
  if (!value) return;
  if (field.key === 'identity') {
    value = value.replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
      .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit));
    if (!/^\d{10}$/.test(value)) {
      composer.querySelector('.error').textContent = 'کد ملی باید ۱۰ رقم باشه.';
      return;
    }
  }
  const answered = field;
  answers[answered.key] = value;
  const visibleValue = answered.key === 'identity' ? '••••••' + value.slice(-4) : value;
  driver(visibleValue, { edit: () => { askField(answered, true); render(); } });
  bot(editing ? 'اصلاح شد.' : 'ثبت شد.');
  if (editing) mode = 'fields';
  else nextField();
  render();
}

function imageKeys() {
  if (task === 'live') return ['face'];
  return documents[task].type === 'card' ? ['front', 'back'] : ['single'];
}

function nextImage() {
  return imageKeys().find(key => !documents[task].images[key]);
}

function imageLabel() {
  if (task === 'live') return 'عکس زنده چهره';
  const label = documentTypes[task][documents[task].type];
  const side = nextImage();
  if (side === 'front') return 'روی ' + label;
  if (side === 'back') return 'پشت ' + label;
  return 'تصویر ' + label;
}

function askPhoto() {
  mode = 'upload';
  if (task === 'live') {
    bot('یه عکس تازه از چهره‌ات بگیر. صورتت کامل توی کادر باشه و نور کافی داشته باشه.');
  } else {
    bot('لطفاً عکس «' + imageLabel() + '» رو بفرست. نوشته‌ها و گوشه‌های مدرک واضح باشن.');
  }
}

function previewPhoto(photo) {
  pendingPhoto = photo;
  driver(imageLabel(), { photo });
  bot('این تصویر رو استفاده کنیم؟');
  mode = 'photo';
  render();
}

function acceptPhoto() {
  documents[task].images[nextImage()] = pendingPhoto;
  pendingPhoto = null;
  driver('بله، همین تصویر.');
  if (nextImage()) {
    askPhoto();
  } else if (task === 'live') {
    bot('عکس چهره دریافت شد.');
    mode = 'done';
  } else {
    bot('تصویرها دریافت شد. اطلاعات نمونه رو بررسی کن و اگه لازم بود تغییر بده.');
    mode = 'review';
  }
}

function renderReview() {
  const details = documents[task].details || sampleDetails[task];
  const inputs = Object.entries(details).map(([label, value]) =>
    '<label>' + escape(label) + '<input required value="' + escape(value) + '"></label>');
  composer.innerHTML = '<div class="composer-title">بررسی اطلاعات مدرک</div><form><div class="review-grid">' +
    inputs.join('') + '</div><button class="send review-action" type="submit">تأیید اطلاعات</button></form>' + controls();
  composer.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const values = [...event.currentTarget.querySelectorAll('input')].map(input => input.value.trim());
    if (values.some(value => !value)) return;
    documents[task].details = Object.fromEntries(Object.keys(details).map((label, index) => [label, values[index]]));
    driver('اطلاعات مدرک رو تأیید می‌کنم.');
    bot(titles(task) + ' ثبت شد. کدوم بخش رو ادامه بدیم؟');
    mode = 'done';
    render();
  };
}

function titles(key) {
  return tasks[key][0];
}

function chooseTask(key) {
  if (key !== task) pendingPhoto = null;
  task = key;
  driver(tasks[key][1]);
  if (task === 'personal') {
    if (isComplete(task)) mode = 'fields';
    else nextField();
  } else if (task === 'live') {
    if (isComplete(task)) {
      bot('عکس چهره‌ات در این گفت‌وگو ثبت شده.');
      mode = 'done';
    } else askPhoto();
  } else if (!documents[task].type) {
    bot(task === 'license' ? 'کارت گواهینامه داری یا رسیدش رو؟' : 'کارت خودرو رو داری یا برگ سبز؟');
    mode = 'doctype';
  } else if (nextImage()) {
    askPhoto();
  } else {
    bot('تصویرهای قبلی اینجا هستن. اطلاعات مدرک رو بررسی کن.');
    mode = 'review';
  }
}

function handleAction(action) {
  const [command, key] = action.split(':');
  switch (command) {
    case 'task': chooseTask(key); break;
    case 'field': askField(fields.find(item => item.key === key), Boolean(answers[key])); break;
    case 'type':
      documents[task].type = key;
      driver(documentTypes[task][key] + ' دارم.');
      askPhoto();
      break;
    case 'tasks':
      previousMode = mode;
      mode = 'tasks';
      break;
    case 'resume': mode = previousMode; break;
    case 'fields': mode = 'fields'; break;
    case 'skip': {
      driver('این مورد بمونه برای بعد.');
      const index = fields.indexOf(field);
      const remaining = [...fields.slice(index + 1), ...fields.slice(0, index)];
      const next = remaining.find(item => !answers[item.key]);
      if (next) askField(next);
      else {
        bot('باشه، هر وقت آماده بودی برمی‌گردیم سراغش.');
        mode = 'tasks';
      }
      break;
    }
    case 'camera':
    case 'gallery':
      composer.querySelector('#' + command).click();
      return;
    case 'sample':
      previewPhoto({ sample: true });
      return;
    case 'retake':
      pendingPhoto = null;
      driver('دوباره انتخاب می‌کنم.');
      askPhoto();
      break;
    case 'keep': acceptPhoto(); break;
    case 'submit':
      submitted = true;
      driver('ثبت‌نام رو برای بررسی می‌فرستم.');
      bot('ارسال آزمایشی انجام شد. برای شروع دوباره، صفحه رو تازه کن.');
      break;
  }
  render();
}

bot('سلام! به ثبت‌نام رانندگان تپسی خوش اومدی. با هم اطلاعات و مدارکت رو ثبت می‌کنیم.');
bot('این نسخه آزمایشیه. می‌تونی با اطلاعات و تصویر نمونه امتحانش کنی. دوست داری از کدوم بخش شروع کنیم؟');
render();
</script>
</body>
</html>
